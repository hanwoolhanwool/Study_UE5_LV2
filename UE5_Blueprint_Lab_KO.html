<script>
const stages=[{"id":"beginner","label":"초급","en":"FOUNDATIONS","title":"Crystal Run","subtitle":"크리스털을 모아 탈출하는 3인칭 게임","desc":"이벤트 하나에서 출발해, 시작과 끝이 있는 첫 게임을 완성합니다.","color":"#11796a","hours":"23–36시간","deliver":"수집 · 제한시간 · 승패 · 재시작 · 실행 파일","gate":"도움말 없이 크리스털 1개를 새로 만들고, 획득 → 점수 → HUD → 승리 흐름을 설명할 수 있다."},{"id":"intermediate","label":"중급","en":"SYSTEMS","title":"Last Stand","subtitle":"적의 웨이브를 버티는 생존 아레나","desc":"작동하는 기능을 서로 연결하고, 변경하기 쉬운 시스템으로 나눕니다.","color":"#3766bd","hours":"40–60시간","deliver":"상호작용 · 전투 · AI · 웨이브 · 성장 · 저장","gate":"적 1종과 업그레이드 1종을 추가하면서 기존 플레이어 그래프의 수정 범위를 설명할 수 있다."},{"id":"senior","label":"시니어","en":"PRODUCTION","title":"Relay Protocol","subtitle":"함께 스위치를 켜고 탈출하는 2인 협동 퍼즐","desc":"권한, 상태, 실패 복구와 성능을 근거로 설계하고 검증합니다.","color":"#8852aa","hours":"48–72시간","deliver":"설계 · 서버 권한 · 동기화 · 저장 복구 · 성능 · 배포","gate":"두 클라이언트와 지연 환경에서 상태를 검증하고, 설계 결정·측정 결과·알려진 한계를 기록할 수 있다."}];
const refs={"basics":["Blueprint Best Practices","https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-best-practices-in-unreal-engine"],"input":["Enhanced Input","https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine"],"framework":["Gameplay Framework","https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-in-unreal-engine"],"communication":["Blueprint Communication Usage","https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-communication-usage-in-unreal-engine"],"save":["Saving and Loading Your Game","https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-your-game-in-unreal-engine"],"ai":["Behavior Tree Quick Start","https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---quick-start-guide"],"network":["Networking Overview","https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"],"rpc":["Remote Procedure Calls","https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-procedure-calls-in-unreal-engine"],"profile":["Performance Profiling","https://dev.epicgames.com/documentation/en-us/unreal-engine/introduction-to-performance-profiling-and-configuration-in-unreal-engine"],"package":["Packaging Your Project","https://dev.epicgames.com/documentation/en-us/unreal-engine/packaging-your-project"],"data":["Data Driven Gameplay Elements","https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"]};
const lessons=[{"id":"b01","stage":0,"title":"프로젝트와 첫 번째 이벤트","time":"2–3시간","tags":["에디터","Actor","이벤트"],"goal":"빈 테스트 공간에 액터를 놓고, 플레이가 시작될 때 메시지를 한 번 출력한다.","concept":"Actor는 월드에 배치되는 객체이고 Component는 그 객체의 기능 조각입니다. Blueprint Class는 설계도, 레벨에 놓인 것은 그 설계도의 인스턴스입니다. 흰색 Exec 핀은 실행 순서, 색 핀은 값과 참조를 전달합니다.","assets":[["CrystalRun","Games → Third Person → Blueprint","프로젝트"],["L_CrystalRun","Level","첫 맵"],["BP_Crystal","Actor","수집물 설계도"],["Value","Integer / 1","BP_Crystal 변수"]],"steps":[["프로젝트 생성","Epic Games Launcher에서 설치한 UE5를 열고 Games → Third Person, Blueprint로 생성합니다. 변형 선택이 있으면 기본형을 고릅니다. 프로젝트 경로와 엔진 버전을 메모하세요. 기본 템플릿의 이동·카메라 동작을 먼저 확인합니다."],["작업 공간 정리","Content 아래 CrystalRun 폴더를 만들고 Blueprints, Maps, UI, Input, Art로 나눕니다. 템플릿 맵을 Save Current Level As로 Maps/L_CrystalRun에 저장합니다. PlayerStart와 바닥을 유지하고 장애물만 단순하게 정리합니다."],["설계도 생성","Content Browser 우클릭 → Blueprint Class → Actor → BP_Crystal. Components에서 Static Mesh와 Sphere Collision을 추가합니다. Static Mesh는 기본 구체로 지정하고 크기를 줄입니다. Compile 후 레벨에 한 개 끌어놓습니다."],["첫 실행선 연결","BP_Crystal의 Event Graph에서 Event BeginPlay의 흰 핀을 끌어 Print String을 검색합니다. In String에 Hello Crystal을 입력합니다. Compile → Save → Play. 메시지 한 번이 목표입니다."],["인스턴스 확인","Integer 변수 Value를 만들고 기본값 1로 설정합니다. Instance Editable을 켜고 Compile한 뒤 액터를 복제합니다. 레벨에서 두 번째 액터의 Value를 5로 바꿉니다. Value를 문자열로 변환해 Print String에 연결하고 각각의 값이 나오는지 확인합니다."]],"graph":"BP_Crystal / Event Graph\nEvent BeginPlay ──▶ Print String\n                     In String ◀── Value (Integer → String)\n\n흰색 선 = 언제 실행할지 / 값 핀 = 무엇을 사용할지","checks":["Play에서 캐릭터가 이동하고 카메라가 회전한다.","서로 다른 두 인스턴스가 1과 5를 각각 출력한다.","Compile 오류 없이 맵과 블루프린트를 저장했다."],"trap":"메시지가 안 보이면 플레이 중인 맵에 BP_Crystal 인스턴스가 있는지 확인합니다. 에셋을 만들기만 해서는 월드에서 실행되지 않습니다.","quiz":["설계도의 기본값을 바꿨는데 일부 인스턴스 값은 왜 그대로일까?","그 인스턴스에서 값을 따로 덮어썼기 때문입니다. Details의 기본값 되돌리기를 사용하면 클래스 기본값을 따릅니다."],"challenge":"BP_Crystal 3개에 다른 Value를 지정하고 출력 문자열에 액터 이름도 추가하세요.","refs":["basics"]},{"id":"b02","stage":0,"title":"입력과 달리기","time":"2–3시간","tags":["Enhanced Input","참조","변수"],"goal":"Shift를 누를 때 달리고, 놓으면 원래 속도로 돌아온다.","concept":"Input Action은 행동의 의미, Input Mapping Context는 키 연결입니다. 이번 수업은 기존 이동 입력을 보존하고 달리기 액션만 추가합니다. Character Movement 컴포넌트의 Max Walk Speed가 보행 속도를 결정합니다.","assets":[["IA_Sprint","Input Action / Boolean","달리기 액션"],["IMC_Crystal","Input Mapping Context","Left Shift 매핑"],["WalkSpeed / SprintSpeed","Float / 500, 850","플레이어 캐릭터 변수"]],"steps":[["내 캐릭터 찾기","플레이 중 조종하는 템플릿 캐릭터 BP를 엽니다. World Settings의 GameMode Override와 그 GameMode의 Default Pawn Class를 확인합니다. 이름은 버전마다 다를 수 있습니다. 이후 초급의 “플레이어 BP”는 이 클래스를 뜻합니다."],["입력 에셋 만들기","Input 폴더에 IA_Sprint를 만들고 Value Type을 Boolean으로 둡니다. IMC_Crystal에 IA_Sprint를 추가하고 Left Shift에 매핑합니다. 별도 Hold Trigger는 넣지 않습니다."],["매핑 컨텍스트 등록","싱글플레이 플레이어 BP의 BeginPlay에서 Get Player Controller(0) → Get Enhanced Input Local Player Subsystem → Add Mapping Context를 연결합니다. Context=IMC_Crystal, Priority=1. 기존 템플릿의 입력 초기화 실행선도 계속 실행되도록 이어 붙이거나 Sequence로 분기합니다."],["속도 연결","WalkSpeed=500, SprintSpeed=850 변수를 만듭니다. BeginPlay에서 Character Movement → Set Max Walk Speed(WalkSpeed). IA_Sprint 이벤트 Started에서 SprintSpeed, Completed와 Canceled에서 WalkSpeed를 설정합니다."],["누름과 반복 구분","입력에 Print String을 잠깐 넣어 Started와 Triggered의 발생 횟수를 비교합니다. 이 액션 설정에서는 Started가 누르기 시작할 때, Triggered는 누르고 있는 동안 반복될 수 있습니다. 실험 후 출력은 제거합니다."]],"graph":"IA_Sprint: Started ──▶ Set Max Walk Speed (850)\nIA_Sprint: Completed ─▶ Set Max Walk Speed (500)\nIA_Sprint: Canceled ──▶ Set Max Walk Speed (500)\n                         Target ◀── Character Movement","checks":["Shift를 누르는 동안에만 속도가 빨라진다.","Shift를 놓으면 속도가 500으로 돌아온다.","기존 이동·점프·카메라 입력이 유지된다."],"trap":"액션 이벤트가 안 뜨면 IMC에 키를 넣었는지, 로컬 플레이어에 컨텍스트를 등록했는지, 실제 조종 중인 BP를 수정했는지 순서대로 확인합니다.","quiz":["달리기 속도 설정을 매 프레임 반복할 필요가 있을까?","이 경우에는 없습니다. 눌렀을 때와 해제됐을 때만 바꾸면 됩니다. 입력 트리거 설정에 따라 이벤트 의미가 달라질 수 있으므로 함께 확인합니다."],"challenge":"SprintSpeed를 Instance Editable로 만들고, 속도별로 같은 코스를 도는 시간을 비교하세요.","refs":["input"]},{"id":"b03","stage":0,"title":"크리스털 수집과 점수","time":"3–4시간","tags":["Overlap","Cast","함수"],"goal":"크리스털 한 개가 정확히 한 번 점수를 올리고 사라진다.","concept":"Overlap은 충돌 영역이 겹칠 때 발생합니다. Cast는 전달받은 객체가 특정 타입인지 확인하며 객체를 새로 만들지 않습니다. 점수 변경은 플레이어의 AddScore 함수 한 곳에서 처리합니다.","assets":[["Score","Integer / 0","플레이어 BP"],["AddScore(Amount)","직접 제작 함수 / Integer 입력","플레이어 BP"],["bCollected","Boolean / false","BP_Crystal"],["Value","Integer / 1","BP_Crystal"]],"steps":[["점수 함수 만들기","플레이어 BP에 Score를 만들고 AddScore 함수를 추가합니다. Amount를 Integer 입력으로 만들고 Set Score의 값에 Score + Amount를 연결합니다. 초급에서는 Score를 플레이어가 관리하고, 다음 단계에서 책임을 분리합니다."],["충돌 설정","BP_Crystal의 Sphere Collision 반경을 90으로 설정합니다. Query Only, Pawn=Overlap, 나머지 채널=Ignore로 설정하고 Generate Overlap Events를 켭니다. Mesh는 NoCollision으로 둡니다. 플레이어 Capsule도 Overlap을 생성해야 합니다."],["대상 검사","Sphere를 선택해 On Component Begin Overlap을 추가합니다. Other Actor를 Cast To 실제 플레이어 BP의 Object에 연결합니다. 성공 실행 핀 뒤에 Branch를 놓고 NOT bCollected를 Condition으로 연결합니다."],["한 번만 반영","Branch True → Set bCollected(true) → Sphere의 Set Collision Enabled(No Collision) → AddScore(Value, Target=Cast 결과) → Destroy Actor(Self)를 연결합니다. 실패 분기는 종료합니다."],["배치와 확인","크리스털 10개를 길 위에 배치하고 Value=1로 맞춥니다. AddScore 안에서 Score를 출력합니다. 획득마다 1씩 증가하는지 확인합니다."]],"graph":"OnComponentBeginOverlap\n  Other Actor ──▶ Cast To 플레이어 BP\n  Cast 성공 ──▶ Branch (NOT bCollected)\n                  True ─▶ bCollected = true\n                       ─▶ Collision = NoCollision\n                       ─▶ AddScore(Value) [직접 제작]\n                       ─▶ Destroy Actor(Self)","checks":["한 개를 먹으면 Score가 정확히 1 증가한다.","겹친 채 여러 프레임 기다려도 중복 점수가 없다.","플레이어가 아닌 물체는 점수를 얻지 못한다."],"trap":"Cast의 Object에 Self를 연결하면 크리스털 자신을 플레이어로 검사하게 됩니다. Overlap의 Other Actor를 연결해야 합니다.","quiz":["Destroy Actor 전에 bCollected를 설정하는 이유는?","같은 액터에 여러 겹침 이벤트가 들어와도 점수를 한 번만 처리하도록 먼저 잠그기 위해서입니다."],"challenge":"Value=5인 보너스 크리스털을 한 개 만들고 일반 수집물과 함께 테스트하세요.","refs":["communication"]},{"id":"b04","stage":0,"title":"HUD와 변경 알림","time":"3–4시간","tags":["UMG","Dispatcher","초기화"],"goal":"현재 점수와 목표를 화면에 표시하고 획득한 순간 갱신한다.","concept":"위젯은 표시를 담당합니다. Event Dispatcher는 값이 바뀌었다는 알림을 구독자에게 전달합니다. 매 프레임 점수를 읽는 대신 변경 시점에 텍스트를 갱신합니다.","assets":[["WBP_RunHUD","User Widget","ScoreText: TextBlock"],["OnScoreChanged(NewScore)","직접 제작 Dispatcher","플레이어 BP"],["InitHUD(PlayerRef)","직접 제작 함수","WBP_RunHUD"],["HUDRef","WBP_RunHUD Object Reference","플레이어 BP"]],"steps":[["위젯 배치","UI 폴더에 Widget Blueprint → User Widget → WBP_RunHUD를 만듭니다. Canvas Panel 아래 TextBlock을 놓고 ScoreText로 이름을 바꿉니다. Is Variable을 켜고 왼쪽 위 Anchor와 여백을 지정합니다."],["알림 발행","플레이어 BP에 OnScoreChanged Dispatcher를 추가하고 NewScore(Integer) 입력을 만듭니다. AddScore 함수에서 Set Score 다음에 Call OnScoreChanged(Score)를 연결합니다."],["위젯 초기화 함수","WBP_RunHUD에 플레이어 BP 타입 PlayerRef 변수를 만듭니다. InitHUD 함수에 같은 타입의 InPlayer 입력을 추가합니다. 변수에 저장한 뒤 Bind Event to OnScoreChanged를 사용합니다. Event 핀은 Create Event로 서명에 맞는 UpdateScore(NewScore) 함수를 선택합니다."],["표시 함수 연결","UpdateScore 함수에서 Format Text “크리스털 {Count} / 10”에 NewScore를 넣고 ScoreText의 Set Text로 전달합니다. InitHUD 마지막에 UpdateScore(PlayerRef.Score)를 직접 호출하여 최초 값 0도 표시합니다."],["생성하고 보관","플레이어 BeginPlay에 Create Widget(WBP_RunHUD, Owning Player=Get Player Controller 0) → 반환값을 HUDRef로 저장 → InitHUD(Self) → Add to Viewport를 연결합니다. 초기화를 반복 호출하지 않습니다."]],"graph":"플레이어 AddScore [직접 제작]\n  Set Score ──▶ Call OnScoreChanged(Score)\n                       │ 구독\n                       ▼\nWBP_RunHUD.UpdateScore(NewScore) [직접 제작]\n  Format Text ──▶ ScoreText.SetText\n\nInitHUD 때 한 번 현재 Score도 표시","checks":["시작 직후 크리스털 0 / 10이 보인다.","획득 직후 HUD의 숫자가 바뀐다.","화면 크기를 바꿔도 점수 표시가 화면 안에 있다."],"trap":"알림은 과거의 변경을 재생하지 않습니다. 구독 이전에 값이 바뀌었을 수 있으므로 구독 직후 현재 값을 한 번 읽어 초기 표시합니다.","quiz":["값이 맞는데 화면만 오래된 값이라면 어디를 볼까?","점수 변경 뒤 Dispatcher 호출, 올바른 플레이어 인스턴스에 대한 Bind, UpdateScore의 실행 순서를 확인합니다."],"challenge":"진행률 ProgressBar를 추가하고 Float(Score) / 10을 0–1로 Clamp해 Percent에 넣으세요.","refs":["communication"]},{"id":"b05","stage":0,"title":"제한시간과 게임의 상태","time":"3–5시간","tags":["Timer","Enum","GameMode"],"goal":"90초 안에 10개를 모으면 승리하고, 시간이 끝나면 패배한다.","concept":"게임 상태는 Playing, Won, Lost 중 하나만 갖도록 만듭니다. GameMode는 규칙을 관리합니다. 지금은 싱글플레이이므로 GameMode를 직접 참조하지만 멀티플레이 클라이언트에서는 같은 방식을 쓰지 않습니다.","assets":[["E_RunState","Enum / Playing, Won, Lost","상태"],["BP_RunGameMode","GameModeBase","규칙"],["Remaining / TargetScore","Integer / 90, 10","GameMode 변수"],["CountdownHandle","Timer Handle","타이머 정리"]],"steps":[["게임모드 지정","E_RunState 열거형을 만듭니다. BP_RunGameMode를 GameModeBase로 만들고 Default Pawn Class를 현재 플레이어 BP로 설정합니다. L_CrystalRun의 World Settings → GameMode Override에 지정합니다. State 기본값은 Playing입니다."],["초기화 순서 고정","플레이어 BeginPlay에서 Get Game Mode → Cast To BP_RunGameMode 결과를 RunGMRef로 저장합니다. HUD를 만든 뒤 RunGMRef의 StartRun(Self) 함수를 호출합니다. StartRun은 중복 시작을 막는 bStarted를 검사하고 플레이어 참조를 저장합니다."],["타이머 만들기","GameMode에 CountDown이라는 Custom Event를 만듭니다. StartRun에서 Set Timer by Event의 Event 핀에 CountDown을 연결하고 Time=1.0, Looping=true, 반환 Handle을 저장합니다. CountDown: State==Playing일 때 Remaining을 1 줄이고 OnTimeChanged(Remaining) Dispatcher를 호출합니다. Remaining\u003c=0이면 FinishRun(false)를 호출합니다."],["승리 검사","GameMode에 EvaluateScore(NewScore) 함수를 만들고 NewScore>=TargetScore이면 FinishRun(true)를 호출합니다. 플레이어 AddScore 시작에서 RunGMRef.State==Playing인지 확인하고, 점수 변경 후 EvaluateScore(Score)를 호출합니다. FinishRun은 Playing일 때만 State를 Won/Lost로 바꾸고 Clear and Invalidate Timer by Handle을 실행한 뒤 OnRunFinished(bWon)를 알립니다."],["시간 HUD 연결","HUD InitHUD에서 GameMode의 OnTimeChanged를 구독하는 UpdateTime 함수를 연결하고 현재 Remaining도 바로 표시합니다. OnRunFinished를 구독해 결과 TextBlock을 표시합니다. StartRun 호출은 HUD 구독 이후가 되도록 합니다."]],"graph":"CountDown [직접 제작 이벤트 / 1초 반복]\n  State == Playing? ─▶ Remaining -= 1 ─▶ OnTimeChanged\n  Remaining \u003c= 0? ──▶ FinishRun(false) [직접 제작]\n\nAddScore ─▶ EvaluateScore(Score) [직접 제작]\n  Score >= TargetScore? ─▶ FinishRun(true)\n\nFinishRun: Playing일 때만 상태 변경 → 타이머 해제 → 결과 알림","checks":["목표를 달성하면 Won으로 한 번만 전환된다.","0초가 되면 Lost가 되고 음수로 내려가지 않는다.","게임 종료 후 남은 수집물로 점수가 더 오르지 않는다."],"trap":"GameMode와 플레이어의 BeginPlay 순서를 가정하면 참조가 아직 없을 수 있습니다. 이 수업은 플레이어가 HUD 초기화 후 StartRun을 명시적으로 호출하도록 구성합니다.","quiz":["승리와 시간 종료가 같은 순간 들어오면 어떻게 결정할까?","먼저 처리되어 State를 바꾼 결과를 유지합니다. 다른 우선순위가 필요하면 명시적인 규칙으로 설계해야 합니다."],"challenge":"목표를 5개, 제한시간을 15초로 바꿔 승리와 패배를 빠르게 반복 검증하세요.","refs":["framework"]},{"id":"b06","stage":0,"title":"함정과 움직이는 장애물","time":"3–5시간","tags":["Timeline","Transform","디버깅"],"goal":"왕복 장애물과 시작점으로 돌아가는 함정으로 코스를 만든다.","concept":"위치의 기준을 분명히 해야 누적 오차를 막을 수 있습니다. Timeline의 0–1 값으로 두 지점 사이 위치를 보간합니다. 이번 장애물은 학습용 이동 발판이며 물리 시뮬레이션은 끕니다.","assets":[["BP_MovingPlatform","Actor / Scene Root + Mesh","왕복 발판"],["StartLocation / EndLocation","Vector","월드 좌표"],["BP_Hazard","Actor / Box Collision","함정"],["RespawnTransform","Transform","플레이어 시작 위치"]],"steps":[["발판 구성","BP_MovingPlatform을 만들고 Scene Root 밑에 Cube Mesh를 추가합니다. Mesh는 Movable, Simulate Physics=false, BlockAll로 둡니다. EndOffset(Vector, 기본 0,0,250)을 Instance Editable로 만듭니다."],["시작점 고정","BeginPlay에서 Get Actor Location을 StartLocation에 저장하고 StartLocation+EndOffset을 EndLocation에 저장합니다. Timeline TL_Move의 Float 트랙 Alpha에 (0초,0), (2초,1), (4초,0) 키를 넣고 Loop를 켭니다. BeginPlay에서 Play합니다."],["위치 보간","TL_Move.Update → Set Actor Location. New Location에는 Lerp(Vector)의 A=StartLocation, B=EndLocation, Alpha=트랙 출력을 넣습니다. 매 프레임 현재 위치에 오프셋을 더하지 않습니다."],["함정과 복귀","플레이어 BeginPlay에서 Get Actor Transform을 RespawnTransform에 저장합니다. BP_Hazard의 Box를 Pawn Overlap으로 설정합니다. 겹친 액터가 플레이어이며 State==Playing이면 Character Movement → Stop Movement Immediately 후 Set Actor Transform(RespawnTransform)을 호출합니다."],["문제를 재현하고 관찰","일부러 잘못된 EndLocation으로 바꾸고 Print String으로 좌표를 출력합니다. 블루프린트 Debug Filter에서 실행 중인 인스턴스를 선택해 Breakpoint와 Watch Value로 원인을 찾은 뒤 복구합니다."]],"graph":"BeginPlay: Start = GetActorLocation\n           End = Start + EndOffset\n           TL_Move.Play\nTL_Move.Update ─▶ SetActorLocation\n  NewLocation ◀─ Lerp(Start, End, Alpha)\n\n함정 Overlap ─▶ 플레이어 검사 ─▶ StopMovement ─▶ 시작 Transform 복원","checks":["발판이 여러 번 왕복해도 같은 양 끝점에 도달한다.","함정에 빠져도 점수를 유지한 채 안전한 시작점으로 돌아온다.","선택한 인스턴스에서 Breakpoint가 멈추고 값을 볼 수 있다."],"trap":"월드 좌표와 상대 좌표를 섞지 않습니다. Set Relative Location을 쓰면 시작점도 상대 좌표로 저장해야 합니다. 이동 발판의 복잡한 네트워크 물리는 이 과정의 범위 밖입니다.","quiz":["매 Update에서 현재 위치 + EndOffset을 쓰면 왜 멀리 날아갈까?","직전 프레임의 결과에 다시 더하여 오프셋이 누적되기 때문입니다. 고정된 두 지점을 보간해야 합니다."],"challenge":"서로 다른 EndOffset을 갖는 발판 3개로 짧은 점프 구간을 만드세요.","refs":["basics"]},{"id":"b07","stage":0,"title":"재시작과 첫 게임 완성","time":"3–4시간","tags":["UI 흐름","Open Level","회귀 테스트"],"goal":"시작 안내, 결과, 재시작까지 연결된 2분 내외의 게임을 완성한다.","concept":"완성된 게임에는 핵심 플레이 외에도 진입과 종료 흐름이 있습니다. 맵을 다시 열면 월드의 Actor는 새로 만들어집니다. 게임 중·종료 후 입력 상태를 함께 관리합니다.","assets":[["WBP_Result","User Widget","결과 문구와 Retry 버튼"],["ShowResult(bWon)","직접 제작 함수","HUD 또는 플레이어"],["L_CrystalRun","Level","재시작 대상"]],"steps":[["안내 넣기","HUD에 “WASD 이동 · 마우스 시점 · Space 점프 · Shift 달리기”를 넣습니다. “90초 안에 크리스털 10개” 목표도 표시합니다. 초급 프로젝트는 별도 타이틀 맵 없이 즉시 플레이하도록 범위를 제한합니다."],["결과 창 생성","WBP_Result에 승패 TextBlock과 Retry Button을 만듭니다. bWon을 Expose on Spawn으로 만들고 Construct에서 문구를 선택합니다. 결과 알림을 받는 곳에서 Create Widget → Add to Viewport를 한 번만 호출합니다."],["입력 전환","결과가 뜨면 PlayerController의 Set Input Mode UI Only와 Show Mouse Cursor=true를 설정하고 Character Movement의 Stop Movement Immediately를 호출합니다. UI Only의 Widget to Focus에 결과 위젯을 연결합니다. 게임을 Pause하지 않아도 종료 상태가 규칙 진행을 막아야 합니다."],["재시작 연결","Retry의 OnClicked → Open Level(by Name), Level Name=L_CrystalRun. 플레이어 BeginPlay에 Set Input Mode Game Only와 Show Mouse Cursor=false를 명시하여 재진입 시 조작이 복원되게 합니다."],["플레이 테스트","목표를 10개로 되돌리고 시작 위치, 함정 간격, 크리스털 배치를 조정합니다. 승리→재시작, 패배→재시작, 연속 3회 재시작을 점검합니다. 한 번에 하나만 바꾸고 변화 이유를 메모합니다."]],"graph":"OnRunFinished(bWon) ─▶ Create WBP_Result\n                     ─▶ AddToViewport\n                     ─▶ InputMode UI Only + Cursor ON\nRetry.OnClicked ─▶ OpenLevel(L_CrystalRun)\n새 BeginPlay ─▶ InputMode Game Only + Cursor OFF","checks":["승리와 패배 모두에서 결과 창이 한 개만 나타난다.","재시작하면 0점·90초이며 마우스로 다시 카메라를 조작한다.","연속 세 번 재시작해도 점수나 UI 이벤트가 중복되지 않는다."],"trap":"UI 모드나 커서 상태는 재시작 흐름에서 명시적으로 초기화하세요. 버튼에 포커스를 주고 Tab/Enter로도 동작하는지 확인합니다.","quiz":["게임 종료 후에도 플레이어가 미끄러진다면?","입력만 차단했을 수 있습니다. 현재 속도도 Stop Movement Immediately로 정리하고, 상태 검사로 이후 규칙 실행을 막습니다."],"challenge":"목표를 읽지 않은 사람에게 1회 플레이를 부탁하고, 어디서 혼란스러웠는지 기록하세요.","refs":["framework"]},{"id":"b08","stage":0,"title":"실행 파일로 전달하기","time":"4–8시간","tags":["패키징","테스트","초급 평가"],"goal":"에디터 밖에서 처음부터 끝까지 플레이되는 Windows 빌드를 만든다.","concept":"에디터에서 성공하는 것과 배포본에서 성공하는 것은 다릅니다. 패키징은 코드와 에셋을 대상 플랫폼용으로 준비하고 실행 가능한 묶음으로 만듭니다. 빌드 시간과 도구 설치 시간은 PC 환경에 따라 추가될 수 있습니다.","assets":[["Game Default Map","L_CrystalRun","Project Settings → Maps & Modes"],["Development 빌드","Windows","검증용 패키지"],["README","텍스트 문서","조작법·버전·알려진 문제"]],"steps":[["시작 맵 지정","Project Settings → Maps & Modes에서 Game Default Map을 L_CrystalRun으로 지정합니다. 모든 BP를 Compile/Save하고 World Settings의 GameMode도 재확인합니다. 초급은 한 맵만 사용합니다."],["패키지 설정","Project Settings의 Packaging에서 배포할 맵 목록에 L_CrystalRun을 추가합니다. Platforms → Windows에서 Development 구성을 선택하고 Package Project를 실행합니다. 버전에 따라 메뉴 이름과 SDK 요구 조건이 다를 수 있습니다. 플랫폼 안내와 Output Log의 첫 오류를 확인합니다."],["폴더 전체 실행","패키지 출력은 프로젝트와 다른 폴더로 지정합니다. 완료되면 에디터를 닫고 생성된 실행 파일을 실행합니다. exe만 분리하지 말고 함께 생성된 콘텐츠와 실행 의존 폴더를 유지합니다."],["출시 전 점검","시작, 이동, 수집, 승리, 패배, 재시작, 창 크기 변경, 종료를 시험합니다. 개발용 Print String을 정리합니다. 알려진 문제를 기록하고 가능하면 다른 Windows PC에서도 실행합니다."],["초급 통과 평가","노트를 보지 않고 보너스 크리스털을 추가합니다. Overlap부터 HUD 갱신과 승리까지 어떤 객체가 어떤 값을 바꾸는지 설명합니다. 빌드 폴더와 조작법을 묶어 CrystalRun_v0.1로 보관합니다."]],"graph":"프로젝트 저장 → 기본 맵 지정 → 맵 포함 확인\n  → Development 패키징 → 에디터 종료\n  → 실행 파일 테스트 → 전체 폴더 + 조작법 전달","checks":["에디터를 닫아도 패키지에서 올바른 맵이 열린다.","패키지에서 승리·패배·재시작을 모두 확인했다.","노트 없이 수집물을 추가하고 점수 흐름을 설명했다."],"trap":"검은 화면이면 Game Default Map과 맵 포함 설정부터 확인합니다. 패키징 실패는 마지막 “Failed” 문구 대신 Output Log의 첫 실제 오류를 찾아 해결합니다.","quiz":["exe만 친구에게 보내면 왜 실행되지 않을 수 있을까?","게임 콘텐츠와 필요한 런타임 파일이 별도 폴더에 있기 때문입니다. 패키징 결과 전체와 필요한 플랫폼 의존성을 함께 확인해야 합니다."],"challenge":"플레이 영상 60초와 “잘된 점 2개 / 다음에 고칠 점 2개” 회고를 남기세요.","refs":["package"]},{"id":"i01","stage":1,"title":"상호작용을 공통 규약으로","time":"4–6시간","tags":["Interface","Line Trace","책임 분리"],"goal":"E 한 키로 보급 상자와 문을 서로 다른 방식으로 작동시킨다.","concept":"새 Third Person Blueprint 프로젝트 LastStand에서 시작합니다. 인터페이스는 “무엇을 할 수 있는가”를 약속하고, 구체적인 동작은 각 객체가 구현합니다. 인터페이스 호출에도 실제 대상 객체 참조는 필요합니다.","assets":[["BPI_Interactable","Blueprint Interface","Interact(Interactor: Actor), 출력 없음"],["BP_Supply / BP_Door","Actor","인터페이스 구현"],["IA_Interact / IMC_Game","Boolean / Mapping Context","E 매핑"],["BP_ArenaCharacter","템플릿 캐릭터 복제","게임모드의 Default Pawn 지정"]],"steps":[["프로젝트 골격","새 프로젝트와 L_Arena를 만듭니다. 템플릿 캐릭터를 BP_ArenaCharacter로 복제하고 BP_ArenaGameMode의 Default Pawn으로 지정합니다. 폴더 Core, Player, Enemies, UI, Data, Maps를 만듭니다. 초급 방식으로 입력 컨텍스트를 등록합니다."],["인터페이스 선언","BPI_Interactable에 Interact 함수를 만들고 Interactor(Actor Object Reference)를 입력으로 추가합니다. BP_Supply와 BP_Door의 Class Settings → Implemented Interfaces에 추가하고 Compile합니다."],["조준 대상 검출","IA_Interact의 Started에서 카메라 World Location을 Start로, Start + Forward Vector×400을 End로 Line Trace by Channel(Visibility)을 호출합니다. Ignore Self=true. 상자와 문의 Mesh는 Visibility를 Block하도록 설정합니다."],["메시지 전송","Return Value가 true일 때 Break Hit Result → Hit Actor → Does Implement Interface(BPI_Interactable)를 검사합니다. 참이면 Interact(Message)의 Target에 Hit Actor, Interactor에 Self를 넣습니다. 이름이 같은 로컬 호출과 Message 노드를 구분합니다."],["개별 구현","BP_Supply의 Event Interact는 bUsed가 false일 때 true로 바꾸고 “보급 획득” 출력 후 Mesh를 숨깁니다. BP_Door의 Event Interact는 Timeline으로 Mesh의 상대 위치를 위로 250 이동합니다. 상자와 문에 각각 E를 눌러 확인합니다."]],"graph":"IA_Interact.Started → LineTraceByChannel\n  Hit? → HitActor가 BPI_Interactable 구현?\n       → Interact (Message) [직접 제작 인터페이스]\n          Target = HitActor / Interactor = Self\n  BP_Supply: 보급 / BP_Door: 열기","checks":["400 유닛 이내의 조준 대상만 작동한다.","상자와 문이 같은 입력에 다른 행동을 한다.","벽을 조준해도 Accessed None 오류가 없다."],"trap":"인터페이스는 대상을 자동으로 찾지 않습니다. Trace 결과의 Hit Actor가 필요합니다. 중급은 로컬 싱글플레이이며 이 흐름을 그대로 클라이언트 권한 처리에 쓰지 않습니다.","quiz":["상자를 새 타입으로 추가할 때 플레이어 Cast 분기를 늘려야 할까?","인터페이스를 구현하면 호출부는 그대로 쓸 수 있습니다. 개별 상자의 동작만 새 클래스에서 구현하면 됩니다."],"challenge":"플레이어 그래프를 수정하지 않고 BP_Lamp를 추가해 E로 불을 켜세요.","refs":["communication"]},{"id":"i02","stage":1,"title":"공유 체력 컴포넌트","time":"4–6시간","tags":["Actor Component","데미지","수명"],"goal":"플레이어와 적이 같은 체력 규칙을 사용한다.","concept":"Health처럼 여러 타입이 공유하는 기능은 Actor Component로 구성합니다. 컴포넌트는 상태·규칙을 관리하고 소유 Actor는 사망 연출과 제거 정책을 정합니다.","assets":[["BPC_Health","Actor Component","MaxHealth=100, CurrentHealth"],["TakeDamage(Amount)","직접 제작 함수","체력 변경"],["OnHealthChanged / OnDeath","직접 제작 Dispatcher","Current, Max / 입력 없음"],["BP_Enemy","Character","BPC_Health 추가"]],"steps":[["컴포넌트 추가","Blueprint Class에서 Actor Component를 골라 BPC_Health를 만듭니다. MaxHealth(Float=100), CurrentHealth(Float), bDead(Boolean=false)를 만듭니다. BeginPlay에서 CurrentHealth=MaxHealth로 초기화합니다."],["변경 진입점","TakeDamage(Amount) 함수를 만듭니다. bDead 또는 Amount\u003c=0이면 종료합니다. CurrentHealth=Clamp(CurrentHealth−Amount,0,MaxHealth)로 설정하고 OnHealthChanged(CurrentHealth,MaxHealth)를 호출합니다. 0이면 bDead=true를 먼저 설정하고 OnDeath를 한 번 호출합니다."],["엔진 데미지 연결","BP_ArenaCharacter와 BP_Enemy에 BPC_Health를 추가합니다. 각 Actor의 Event AnyDamage에서 Damage 값을 자기 Health 컴포넌트의 TakeDamage로 전달합니다. Apply Damage가 Actor에 들어오고 컴포넌트로 넘겨지는 경계를 확인합니다."],["소유자 반응","각 Actor BeginPlay에서 OnDeath에 이벤트를 Bind합니다. 적은 충돌을 끄고 Destroy Actor, 플레이어는 입력 이동을 막고 GameMode의 EndRun(false) 함수를 호출하도록 준비합니다. 이번 수업의 EndRun은 bRunEnded 중복 검사 후 “패배” 출력만 해도 됩니다."],["HUD 및 실험","초급의 Create Widget/Init 패턴으로 WBP_ArenaHUD를 만들고 Health 참조를 주입합니다. OnHealthChanged 구독 후 현재값을 표시합니다. 테스트 키 K에 Apply Damage(Self,25)를 연결해 네 번 누르면 사망하는지 확인합니다."]],"graph":"Apply Damage(TargetActor, 25)\n  → TargetActor.Event AnyDamage\n  → BPC_Health.TakeDamage(25) [직접 제작]\n  → Clamp → OnHealthChanged\n  → Health == 0 AND 최초 사망 → OnDeath\n  → 소유 Actor가 사망 처리","checks":["100 체력에 25 데미지 네 번이면 0이 된다.","사망 후 추가 데미지에도 OnDeath가 다시 발생하지 않는다.","적과 플레이어가 동일 컴포넌트를 사용한다."],"trap":"UI만 체력을 바꾸면 실제 게임 규칙과 어긋납니다. 체력 쓰기는 컴포넌트에 모으고 UI는 표시만 합니다. 컴포넌트 초기값과 소유자 구독 순서에 의존하지 않도록 현재값 조회도 제공합니다.","quiz":["컴포넌트가 플레이어를 직접 재시작시키지 않는 이유는?","소유자가 적인지 플레이어인지에 따라 사망 결과가 다르기 때문입니다. 공통 규칙과 개별 정책을 분리합니다."],"challenge":"Heal(Amount)을 추가하되 MaxHealth 초과와 사망 후 회복 허용 여부를 명시하세요.","refs":["basics","communication"]},{"id":"i03","stage":1,"title":"조준과 발사, 재사용 대기시간","time":"4–6시간","tags":["Trace","Cooldown","피드백"],"goal":"클릭으로 조준한 적에게 피해를 주고 발사 간격을 제한한다.","concept":"히트스캔 무기는 Trace 결과를 즉시 판정합니다. 발사 가능 시간과 데미지 계산을 UI와 분리합니다. 이번 작품은 기본 도형과 간단한 효과만으로 게임성을 먼저 검증합니다.","assets":[["IA_Fire","Boolean / 왼쪽 마우스","Started 사용"],["Damage / FireInterval","Float / 25, 0.25","무기 수치"],["NextFireTime","Float / 0","플레이어 변수"],["TryFire","직접 제작 함수","발사 진입점"]],"steps":[["발사 액션","IA_Fire를 IMC_Game에 매핑하고 BP_ArenaCharacter의 Started에 TryFire를 연결합니다. 싱글플레이이므로 이 단계의 판정은 로컬에서 합니다."],["발사 조건","TryFire에서 Health.bDead와 GameMode.bRunEnded가 false인지 검사합니다. Get Game Time in Seconds가 NextFireTime보다 작으면 종료합니다. 통과하면 NextFireTime=현재시간+FireInterval로 먼저 갱신합니다."],["카메라 조준","카메라 위치에서 전방 5000까지 Visibility Trace를 합니다. Hit가 있으면 Impact Point, 없으면 Trace End를 AimPoint로 둡니다. 총구 대신 캐릭터 앞쪽 Scene Component Muzzle을 추가합니다."],["벽 관통 방지","Muzzle World Location부터 AimPoint까지 두 번째 Trace를 합니다. Ignore Self=true. 두 번째 Trace의 Hit Actor가 유효하면 Apply Damage에 Base Damage=Damage, Event Instigator=Get Controller, Damage Causer=Self를 전달합니다. 적 Mesh/Capsule은 해당 Trace 채널을 막도록 설정합니다."],["시각 피드백","개발 중에는 Draw Debug Type을 For Duration으로 설정해 궤적을 봅니다. WBP_ArenaHUD에 중앙 십자선을 배치합니다. 피격 여부를 문자열로 잠깐 확인하고 정식 빌드에서는 디버그 선을 끕니다."]],"graph":"TryFire [직접 제작]\n  Alive AND Running AND Now >= NextFireTime?\n  → NextFireTime = Now + 0.25\n  → 카메라 Trace → AimPoint\n  → Muzzle에서 AimPoint까지 Trace\n  → HitActor에 ApplyDamage(25)","checks":["클릭 한 번에 최대 한 번 피해가 들어간다.","연속 입력해도 0.25초 제한을 넘지 않는다.","카메라가 벽 너머를 보더라도 총구 앞 벽이 발사를 막는다."],"trap":"카메라 Trace만으로 피해를 주면 3인칭 시점에서 벽 뒤 표적을 맞힐 수 있습니다. 총구에서 한 번 더 검사해 차폐를 반영합니다.","quiz":["NextFireTime을 Trace 뒤 늦게 바꾸면 어떤 문제가 생길 수 있을까?","발사 처리 중 다시 호출되는 구조에서 중복 발사를 허용할 수 있습니다. 조건 통과 직후 발사 슬롯을 예약하면 재진입을 막기 쉽습니다."],"challenge":"탄약 12발과 Reload 입력을 추가하고, 재장전 중 발사와 사망 후 재장전을 막으세요.","refs":["input","basics"]},{"id":"i04","stage":1,"title":"추적하고 공격하는 적 AI","time":"6–8시간","tags":["AIController","NavMesh","Behavior Tree"],"goal":"적이 플레이어를 추적하고 가까이 오면 일정 간격으로 공격한다.","concept":"AIController는 의사결정, Character는 몸, NavMesh는 이동 가능한 영역입니다. Behavior Tree는 Blackboard의 상태를 읽습니다. 이 수업은 단일 플레이어를 계속 추적하는 최소 AI로 시야 감지는 확장 과제입니다.","assets":[["BP_EnemyAI","AIController","BP_Enemy에 지정"],["BB_Enemy","Blackboard","TargetActor: Object(Actor)"],["BT_Enemy","Behavior Tree","추적→공격→대기"],["BTT_Attack","BTTask_BlueprintBase","커스텀 태스크"]],"steps":[["이동 가능한 공간","L_Arena에 NavMeshBoundsVolume을 놓아 바닥을 덮습니다. P로 내비게이션 영역을 확인합니다. BP_Enemy의 AI Controller Class=BP_EnemyAI, Auto Possess AI=Placed in World or Spawned로 설정합니다."],["대상 초기화","BP_EnemyAI의 Event On Possess에서 Use Blackboard(BB_Enemy)를 호출합니다. 반환 Blackboard Component의 TargetActor 키에 Get Player Character(0)을 저장한 다음 Run Behavior Tree(BT_Enemy)를 실행합니다. 이 수업의 0번 조회는 싱글플레이 전용입니다."],["트리 만들기","BT_Enemy의 Blackboard Asset을 지정합니다. Root → Sequence → Move To(TargetActor, Acceptable Radius=120) → BTT_Attack → Wait(1.0) 순서로 배치합니다. Sequence에 TargetActor Is Set Decorator를 붙입니다."],["공격 태스크","BTT_Attack의 Receive Execute AI에서 Controlled Pawn과 Blackboard TargetActor의 유효성을 확인합니다. 거리가 180 이하이고 대상 Health가 살아 있을 때 Apply Damage(10, Instigator=Owner Controller)를 호출합니다. 성공·실패 모든 분기에서 Finish Execute를 호출합니다."],["실패 관찰","BP_Enemy를 한 개 배치하고 플레이어를 따라오는지 확인합니다. 길을 막고 Move To 실패를 관찰합니다. 타깃이 사망하면 AI의 Stop Movement와 Brain Component의 Stop Logic을 호출하도록 플레이어 사망 알림에 연결합니다."]],"graph":"OnPossess → UseBlackboard → TargetActor 설정 → RunBehaviorTree\nRoot → Sequence\n         ├─ Move To(TargetActor)\n         ├─ BTT_Attack [직접 제작: 거리 검사 → ApplyDamage → FinishExecute]\n         └─ Wait(1.0)","checks":["NavMesh 안에서 장애물을 돌아 플레이어를 추적한다.","공격 범위 밖에서는 데미지가 들어오지 않는다.","AI 태스크의 실패 분기에서도 트리가 영원히 멈추지 않는다."],"trap":"적이 안 움직이면 NavMesh, AI Controller 지정, Auto Possess AI, TargetActor 유효성 순으로 확인합니다. Spawn된 적도 자동 빙의되도록 설정해야 합니다.","quiz":["Finish Execute를 빠뜨리면 왜 다음 Wait로 가지 않을까?","태스크가 완료를 보고하지 않아 실행 중 상태로 남기 때문입니다. 모든 종료 경로에 완료 처리가 필요합니다."],"challenge":"AI Perception의 Sight 감지를 붙여 플레이어를 발견했을 때만 TargetActor를 설정하세요.","refs":["ai"]},{"id":"i05","stage":1,"title":"웨이브와 게임 루프","time":"5–7시간","tags":["Array","Spawn","Dispatcher"],"goal":"적을 모두 처리하면 다음 웨이브가 시작되고 5웨이브 후 승리한다.","concept":"남은 적 수만 믿기보다 실제로 등록된 적 목록을 관리하면 중복 사망 이벤트를 방어하기 쉽습니다. 생성 성공과 제거를 각각 한 번만 계산합니다.","assets":[["BP_WaveDirector","Actor","웨이브 관리"],["ActiveEnemies","BP_Enemy Object Reference Array","살아 있는 등록 목록"],["SpawnPoints","TargetPoint Object Reference Array","Instance Editable"],["WaveIndex / MaxWaves","Integer / 0, 5","진행 상태"]],"steps":[["스폰 지점","맵에 TargetPoint 4개와 BP_WaveDirector 한 개를 배치합니다. Director의 SpawnPoints 배열에 레벨 지점을 지정합니다. 빈 배열은 오류 문구를 출력하고 시작을 중단하도록 검사합니다."],["생성 함수","StartWave 함수에서 WaveIndex를 1 올리고 bSpawning=true로 둡니다. For Loop로 WaveIndex+2마리를 생성합니다. 매회 Random Array Item으로 지점을 고르고 Spawn Actor from Class(BP_Enemy)를 호출합니다. 반환값이 유효한 경우에만 ActiveEnemies.AddUnique를 하고 OnDestroyed에 HandleEnemyDestroyed를 Bind합니다."],["중복 제거","HandleEnemyDestroyed(DestroyedActor)에서 ActiveEnemies.Remove Item의 반환값이 true일 때만 진행합니다. Remove 결과와 관계없이 숫자를 빼는 방식을 쓰지 않습니다. 루프 완료 후 bSpawning=false로 바꾸고 EvaluateWave를 호출합니다."],["종료 판정","EvaluateWave 함수는 bSpawning=false, ActiveEnemies.Length==0, bWaitingNext=false, bRunEnded=false를 검사합니다. WaveIndex>=5면 GameMode.EndRun(true). 아니면 bWaitingNext=true 후 3초 단발 타이머를 예약합니다. 타이머 이벤트는 bWaitingNext=false로 바꾸고 StartWave를 호출합니다."],["전체 연결","시작 지연용 1초 단발 타이머에서 첫 StartWave를 호출합니다. 플레이어 사망 시 Director의 StopWaves를 호출하여 대기 타이머를 해제하고 AI를 정지합니다. Director에 OnWaveChanged(WaveIndex:Integer, AliveCount:Integer) Dispatcher를 만들고 생성/제거/웨이브 변경 뒤 호출합니다. HUD는 Director 참조를 주입받아 구독하고 현재값도 한 번 표시합니다. 승패 위젯·재시작은 초급 패턴을 적용합니다."]],"graph":"StartWave → Spawn 성공만 ActiveEnemies에 등록 + OnDestroyed 구독\nSpawn 루프 완료 → bSpawning=false → EvaluateWave\nOnDestroyed → RemoveItem(성공 시) → EvaluateWave\n  목록 비었음 AND 생성 중 아님 AND 대기 중 아님?\n  → 마지막 웨이브: 승리 / 그 외: 단발 Timer 3초 → StartWave","checks":["1웨이브는 3마리이며 생성 성공 수와 HUD가 일치한다.","마지막 적이 사라진 뒤 다음 웨이브가 딱 한 번 시작한다.","플레이어 사망 후 대기 중이던 웨이브가 생성되지 않는다."],"trap":"스폰 루프 중 임시로 배열이 비었다고 다음 웨이브를 예약하면 중복 시작됩니다. bSpawning과 bWaitingNext로 상태를 구분하고 생성 실패 원인도 로그에 남깁니다.","quiz":["적의 체력이 0일 때와 Destroyed일 때 둘 다 카운트를 빼도 될까?","안 됩니다. 이 설계에서는 OnDestroyed만 등록 해제의 기준으로 삼고 Remove Item 성공으로 중복을 방지합니다."],"challenge":"스폰 실패 횟수가 0이 아닌 경우 화면에 진단 문구를 보여 주고 웨이브 재시도 정책을 정하세요.","refs":["communication","framework"]},{"id":"i06","stage":1,"title":"데이터로 추가하는 성장 선택지","time":"5–8시간","tags":["Struct","Data Table","UI"],"goal":"웨이브 사이에 데이터 테이블에서 읽은 업그레이드 하나를 고른다.","concept":"수치와 표현은 데이터로, 적용 규칙은 함수로 분리합니다. 테이블에 행을 추가하는 것과 새로운 효과 종류를 구현하는 것은 다른 작업입니다. 처음에는 Damage와 MaxHealth 두 효과만 지원합니다.","assets":[["E_UpgradeType","Enum / Damage, MaxHealth","효과 종류"],["ST_Upgrade","Structure","Title(Text), Type(Enum), Amount(Float)"],["DT_Upgrades","Data Table / ST_Upgrade","공격력+5, 최대체력+20"],["WBP_UpgradeChoice","User Widget","선택 UI"]],"steps":[["데이터 작성","E_UpgradeType과 ST_Upgrade를 만든 뒤 해당 구조체로 Data Table을 생성합니다. Row Name은 Dmg_01, Hp_01처럼 고유 이름으로 지정합니다. 각각 Title, Type, Amount를 입력합니다."],["제안 생성","Get Data Table Row Names로 행 이름 배열을 읽고 Shuffle한 복사본에서 최대 2개를 선택합니다. Get Data Table Row의 Row Found/Not Found 분기를 모두 처리합니다. 선택 UI에 Row Name과 Title을 전달합니다."],["웨이브 사이 끼우기","i05의 다음 웨이브 타이머 자동 예약 부분을 “선택 UI 표시”로 교체합니다. 게임 Pause 대신 bWaitingChoice=true와 플레이어 bCanFire=false를 사용합니다. UI Only와 커서를 켜고 이미 남은 적이 0인 상태에서만 표시합니다."],["적용 함수","플레이어에 ApplyUpgrade(RowName) 함수를 만듭니다. 테이블에서 행을 다시 조회하고 Switch on E_UpgradeType으로 분기합니다. Damage는 현재 Damage+Amount. MaxHealth는 컴포넌트 MaxHealth와 CurrentHealth에 Amount를 더하고 CurrentHealth를 0–MaxHealth로 Clamp한 뒤 OnHealthChanged를 호출합니다. 이 변경은 컴포넌트의 IncreaseMaxHealth(Amount) 함수로 묶어 호출합니다. AppliedUpgradeIds(Name Array)에 RowName을 기록합니다."],["한 번만 선택","버튼을 누르면 Director의 bWaitingChoice를 검사한 후 먼저 false로 바꿉니다. ApplyUpgrade → Remove from Parent → Game Only/커서 끄기 → bCanFire=true → 기존 3초 타이머로 다음 웨이브를 연결합니다."]],"graph":"웨이브 종료 → DT_Upgrades에서 후보 읽기 → 선택 UI\n선택(RowName) → bWaitingChoice 검사/해제\n → ApplyUpgrade(RowName) [직접 제작]\n → Switch(Type): Damage / MaxHealth\n → UI 닫기 → 다음 웨이브 Timer","checks":["테이블 수치를 바꾸면 그래프 수정 없이 실제 효과가 바뀐다.","버튼을 빠르게 두 번 눌러도 한 번만 적용된다.","존재하지 않는 Row Name에서 기본 오류 처리가 동작한다."],"trap":"새로운 효과 Enum 값을 추가했으면 적용 함수도 구현해야 합니다. 모든 기능이 데이터 행 추가만으로 생기는 것은 아닙니다.","quiz":["UI가 표시한 Amount를 그대로 받아서 적용하는 것보다 RowName을 다시 조회하는 이유는?","규칙이 사용하는 원본 데이터를 한 곳으로 모으고 UI 표시와 실제 적용 값이 어긋나지 않게 하기 위해서입니다."],"challenge":"기존 Damage 타입의 값만 다른 업그레이드 3개를 만들고 코드 수정 없이 선택지에 등장시키세요.","refs":["data"]},{"id":"i07","stage":1,"title":"최고 기록 저장과 안전한 읽기","time":"5–7시간","tags":["SaveGame","실패 분기","GameInstance"],"goal":"게임을 종료했다 켜도 최고 웨이브와 처치 수가 유지된다.","concept":"GameInstance는 레벨 이동을 넘어 살아 있지만 앱 종료 후에는 사라집니다. 디스크 보존은 SaveGame이 맡습니다. 중급에서는 진행 중 전투 복원 대신 최고 기록만 저장하여 범위를 작게 유지합니다.","assets":[["SG_ArenaProfile","SaveGame","BestWave, BestKills, SchemaVersion=1"],["BP_ArenaGI","GameInstance","ProfileRef, bSaveInProgress"],["SlotName","String / ArenaProfile","저장 슬롯, UserIndex=0"]],"steps":[["저장 데이터 정의","SG_ArenaProfile을 만들고 BestWave와 BestKills Integer를 추가합니다. BP_ArenaGI를 만들고 Project Settings → Maps & Modes의 Game Instance Class에 지정합니다. ProfileRef는 SG_ArenaProfile 참조입니다."],["초기 읽기","GameInstance의 Event Init에서 Does Save Game Exist(SlotName,0)를 검사합니다. 없으면 Create Save Game Object. 있으면 Load Game from Slot → Is Valid → Cast To SG_ArenaProfile을 검사합니다. 성공하면 ProfileRef에 보관합니다."],["실패 대처","로드/형변환 실패 또는 지원하지 않는 SchemaVersion이면 기본 Profile을 메모리에 만들고 bLoadFailed=true를 둡니다. 기존 저장을 자동으로 덮어쓰지 않고 HUD에 “기록을 읽지 못했습니다”를 보여 줍니다. 새 기록 시작 버튼을 눌렀을 때만 덮어쓰기를 허용합니다."],["기록 반영","게임 종료 시 GameMode가 GI의 UpdateBest(Wave,Kills) 함수를 호출합니다. 기존 기록과 Max로 비교해 더 큰 값만 저장 객체에 넣습니다. 단일 SaveProfile Custom Event가 bSaveInProgress를 검사하고 Async Save Game to Slot을 실행하게 만듭니다."],["완료 확인","비동기 저장 완료의 Success를 확인하여 성공/실패 안내를 표시하고 bSaveInProgress=false로 되돌립니다. 이 작은 프로젝트는 저장 중 재시작 버튼을 잠시 비활성화하여 상태 경합을 피합니다. 패키지에서 종료·재실행도 테스트합니다."]],"graph":"Init → 슬롯 존재?\n  없음 → CreateSaveGameObject → ProfileRef\n  있음 → Load → 유효/타입/버전 검사\n            성공 → ProfileRef / 실패 → 기본값 + 덮어쓰기 보류\nEndRun → 최고값 갱신 → SaveProfile [직접 제작 이벤트]\n       → AsyncSaveGameToSlot → Success 확인 → 결과 표시","checks":["앱을 종료하고 다시 실행해도 최고 기록이 남는다.","새 슬롯에서도 기본값으로 정상 시작한다.","로드 실패 경로에서 기존 저장을 자동 덮어쓰지 않는다."],"trap":"SaveGame 객체를 생성하는 것만으로 디스크 저장이 되지 않습니다. 저장 노드 실행과 결과 확인이 필요합니다. 비동기 저장 노드는 일반 Blueprint 함수 안이 아니라 이벤트 그래프에서 사용합니다.","quiz":["GameInstance 변수만으로 최고 기록을 저장할 수 있을까?","같은 앱 실행 중 레벨 이동에는 유지되지만 앱 종료 후에는 사라집니다. 다음 실행까지 보존하려면 디스크 저장이 필요합니다."],"challenge":"개발용 다른 SlotName을 사용해 손상/미존재 경로를 실험하고 실제 기록과 분리하세요.","refs":["save"]},{"id":"i08","stage":1,"title":"밸런스·구조·중급 출시 점검","time":"7–12시간","tags":["리팩터링","프로파일링","중급 평가"],"goal":"10분 안팎의 한 판을 완성하고 데이터 추가와 변경 비용을 검증한다.","concept":"리팩터링은 관찰 가능한 행동을 유지하며 내부 구조를 개선하는 작업입니다. “Tick은 무조건 나쁘다” 같은 규칙 대신 호출 빈도, 작업량, 결합도를 보고 판단합니다.","assets":[["DT_EnemyStats","Data Table","체력, 이동속도, 공격력"],["BP_EnemyFast","BP_Enemy 자식","빠르지만 약한 적"],["테스트 기록","재현 절차 + 기대/실제 결과","품질 기록"]],"steps":[["변경 전 기준","현재 5웨이브를 플레이하고 소요 시간, 피격 횟수, 사망 웨이브를 메모합니다. 백업 또는 소스 관리 체크포인트를 남깁니다. 결과 HUD, Retry, 최고 기록 표시까지 완성합니다."],["적 데이터 적용","ST_EnemyStats와 DT_EnemyStats를 만들고 행에 MaxHealth, MoveSpeed, AttackDamage를 넣습니다. Enemy InitializeEnemy(RowName) 함수에서 적용하고 Health 초기화 순서를 명확히 합니다. BeginPlay 초기화 뒤 이 함수를 호출해 CurrentHealth도 새 MaxHealth로 맞춥니다."],["새 적 추가","BP_EnemyFast 자식을 만들고 외형 색과 사용할 행 이름을 지정합니다. Director가 웨이브별 적 클래스 또는 행 이름을 선택하게 합니다. 기존 적 공격 태스크는 소유 적의 AttackDamage를 읽도록 바꿉니다."],["참조와 이벤트 정리","Get All Actors of Class를 매 프레임 쓰는 곳이 있다면 생성 시 등록하는 참조로 바꿉니다. 종료 시 타이머를 지우고 제거되는 UI가 구독한 Dispatcher는 해당 이벤트만 Unbind합니다. 유효하지 않은 참조 경로를 테스트합니다."],["측정 후 패키징","같은 적 수와 카메라에서 stat unit으로 Frame/Game/Draw/GPU 시간을 기록합니다. 병목 후보 한 가지를 바꾸고 재측정합니다. L_Arena를 포함한 Development 패키지에서 전투→성장→승패→저장→재시작을 점검합니다."]],"graph":"기준 플레이 기록 → 새 데이터/적 추가\n → 동일 행동 회귀 테스트 → 같은 조건 성능 측정\n → 원인 하나 수정 → 다시 측정 → 패키지 확인","checks":["플레이어 전투 그래프를 복제하지 않고 새 적을 추가했다.","5웨이브 완료와 패배에서 저장·재시작이 정상이다.","변경 전후 측정값과 수정 근거를 기록했다."],"trap":"FPS만 보고 블루프린트가 병목이라고 결론 내리지 않습니다. GPU 병목이면 그래프 정리만으로 프레임 시간이 크게 줄지 않을 수 있습니다.","quiz":["큰 그래프를 모두 Macro로 감싸면 구조가 좋아질까?","화면만 작아질 수 있습니다. 책임과 데이터 소유자가 분명해야 하며, 재사용·오버라이드·지연 실행 필요에 맞춰 함수와 이벤트 등을 선택해야 합니다."],"challenge":"제3자가 문서만 보고 새 업그레이드 한 개를 추가할 수 있는지 확인하세요.","refs":["profile","basics","package"]},{"id":"s01","stage":2,"title":"협동 게임의 설계 계약","time":"5–7시간","tags":["아키텍처","상태 소유권","설계 문서"],"goal":"2인이 스위치 두 개를 동시에 켜면 문이 열리는 게임의 권한과 상태를 정의한다.","concept":"시니어 단계는 직급 인증이 아니라 설계·검증 훈련입니다. 새 Third Person 프로젝트 RelayProtocol을 사용합니다. 중급의 싱글플레이 시스템을 전부 이식하지 않고, 네트워크를 처음부터 고려한 작은 게임을 만듭니다.","assets":[["BP_RelayGM","GameModeBase","서버 규칙·플레이어 입장"],["BP_RelayGS","GameStateBase","공유 퍼즐 상태"],["BP_RelayPC / BP_RelayPS","PlayerController / PlayerState","소유자 입력 / 플레이어별 공개 상태"],["BP_RelayCharacter","Character","소유된 Pawn·RPC 진입점"]],"steps":[["규모 고정","L_Relay 한 맵, PlayerStart 2개, 스위치 2개, 문 1개, 탈출 구역 1개로 정합니다. 스위치는 E로 켜고 끄는 래치 방식입니다. 둘 다 켜지면 문은 영구 개방됩니다. 두 플레이어가 탈출 구역에 들어오면 팀 승리입니다. 인터넷 매칭과 계정 시스템은 확장 범위로 기록합니다."],["객체 역할 작성","GameMode=서버 규칙, GameState=팀 공유 상태, PlayerController=소유자 입력/UI, PlayerState=공개 플레이어 상태, Character=몸과 소유된 RPC 진입점으로 표를 만듭니다. GameInstance는 로컬 세션 사이 정보이며 자동 복제되지 않는다고 표시합니다."],["초기 클래스 지정","각 BP를 만들고 BP_RelayGM의 Player Controller, Player State, Game State, Default Pawn Class에 지정합니다. 맵의 GameMode Override도 설정합니다. 템플릿 입력 초기화는 로컬 제어 캐릭터에서만 실행합니다."],["상태 계약","스위치별 bActive, 문 bOpen, GameState의 PuzzlePhase(Enum: Waiting, Playing, Complete)를 정의합니다. 쓰기는 서버만 수행하고 UI는 읽기만 하도록 설계합니다. 플레이어가 2명보다 적으면 Waiting으로 둡니다."],["검증 계획","“동시에 같은 스위치 누름”, “문이 열린 뒤 접속”, “한 명 종료”, “고지연”을 테스트 목록에 넣습니다. 상태 저장 위치, 변경 주체, 표시 방법, 초기 동기화 경로를 각 변수마다 적습니다."]],"graph":"입력: 소유 Client → Character의 Server RPC\n규칙: Server의 GameMode / PuzzleDirector\n상태: Switch.bActive + Door.bOpen + GameState.PuzzlePhase\n표시: 각 Client가 복제된 상태로 UI/외형 재구성\n\nGameInstance ≠ 네트워크 공유 저장소","checks":["각 상태의 소유자와 쓰기 주체를 표로 설명했다.","멀티플레이 클라이언트에서 GameMode를 UI 데이터로 조회하지 않는다.","프로젝트 범위와 네트워크 테스트 항목을 문서화했다."],"trap":"처음부터 대형 RPG, 인벤토리, GAS, 온라인 서비스까지 함께 넣으면 권한과 복제 문제를 분리해 배우기 어렵습니다. 이 작품은 작은 퍼즐의 품질을 깊게 검증합니다.","quiz":["팀의 승리 상태를 GameMode에만 두면 클라이언트는 어떻게 될까?","GameMode는 서버에만 존재합니다. 클라이언트가 읽을 공유 상태는 GameState 같은 복제되는 객체에 두어야 합니다."],"challenge":"새로운 팀 점수를 추가한다고 가정하고 소유자·쓰기 권한·UI 구독 위치를 설계하세요.","refs":["framework","network"]},{"id":"s02","stage":2,"title":"서버가 결정하는 상호작용","time":"6–9시간","tags":["RPC","Ownership","검증"],"goal":"클라이언트 입력 요청을 서버가 검증한 뒤에만 스위치 상태를 바꾼다.","concept":"클라이언트가 소유하는 Character를 통해 Server RPC를 보냅니다. 월드에 놓인 스위치는 보통 해당 클라이언트 소유가 아니므로 직접 Server RPC를 호출하는 통로로 삼지 않습니다.","assets":[["BP_RelaySwitch","Actor / Replicates=true","SwitchId(Name), bActive"],["Server_TryInteract(Target)","직접 제작 Custom Event","Run on Server / Reliable"],["LastInteractTime","Float / -1","서버 측 캐릭터 변수"],["BPI_RelayInteract","Interface","ServerInteract(Interactor), 출력 없음"]],"steps":[["로컬 대상 선택","중급 i01의 Trace 패턴을 새 캐릭터에 적용하고 Is Locally Controlled일 때만 입력을 처리합니다. 카메라 Trace로 얻은 Hit Actor를 Server_TryInteract(Target) 파라미터로 전달합니다. Character의 Replicates가 켜져 있어야 합니다."],["RPC 속성","Character에 Custom Event를 만들고 Details에서 Replicates=Run on Server, Reliable을 켭니다. 저빈도 E 입력 요청으로 제한합니다. 연속 Tick에서 Reliable RPC를 호출하지 않습니다."],["서버 검증","서버 이벤트에서 Target Is Valid, BPI_RelayInteract 구현 여부, PuzzlePhase==Playing, 서버의 캐릭터 위치와 Target 거리\u003c=300을 검사합니다. 서버 Eye View Point에서 Target 위치로 Trace하여 첫 차폐 대상이 Target인지 확인합니다. 서버 시간−LastInteractTime>=0.25도 검사합니다."],["상태 수정","모든 검사 통과 후 LastInteractTime을 갱신하고 Target에 ServerInteract(Message)를 호출합니다. BP_RelaySwitch의 구현에서는 Has Authority를 확인한 뒤 bActive를 토글합니다. bActive를 바꾸는 다른 클라이언트 경로는 만들지 않습니다."],["양쪽 창에서 실험","Play 설정의 Number of Players=2, Net Mode=Play As Listen Server, New Editor Window를 사용합니다. 두 창에서 각각 E를 누릅니다. 검증 실패 이유를 서버 로그에만 기록해 거리·차폐·쿨다운을 점검합니다. 다음 수업에서 외형 동기화를 완성합니다."]],"graph":"소유 Client: E → Trace → Server_TryInteract(Target) [직접 제작 RPC]\nServer: Target/거리/차폐/상태/쿨다운 검사\n  통과 → ServerInteract(Target) [직접 제작 인터페이스]\n       → Authority에서 bActive 변경\n  실패 → 상태 변경 없음","checks":["서버와 원격 클라이언트의 요청이 모두 서버 검사에 도달한다.","거리 밖·벽 너머·연속 요청이 서버에서 거절된다.","클라이언트 로컬에서 bActive를 확정하는 경로가 없다."],"trap":"Run on Server 설정만으로 모든 Actor에서 클라이언트 호출이 전달되는 것은 아닙니다. 해당 클라이언트가 소유한 복제 Actor를 통로로 사용해야 합니다. Blueprint 검증은 이벤트 내부 Branch로 직접 구현합니다.","quiz":["클라이언트가 보낸 “성공=true”를 신뢰해도 될까?","안 됩니다. 요청의 대상과 조건을 서버의 상태로 다시 검사하고 결과를 서버가 계산해야 합니다."],"challenge":"서버에서 거절 사유를 구분하고, 필요한 경우 Owning Client RPC로 해당 사용자에게만 안내하세요.","refs":["rpc"]},{"id":"s03","stage":2,"title":"상태 복제와 뒤늦은 참가자","time":"6–9시간","tags":["RepNotify","상태와 이벤트","멱등성"],"goal":"모든 창에서 스위치와 문이 같은 상태로 보이며 뒤늦게 참가해도 복원된다.","concept":"지속되는 사실은 복제 변수로 표현합니다. 순간 소리만 멀티캐스트로 전달할 수 있지만 문이 열렸다는 사실 자체를 일회성 이벤트에만 의존시키지 않습니다. 표시 함수는 같은 값으로 여러 번 호출해도 결과가 같도록 만듭니다.","assets":[["bActive / bOpen","Boolean / RepNotify","Switch / Door"],["ApplySwitchVisual / ApplyDoorVisual","직접 제작 함수","현재 상태를 외형에 적용"],["BP_PuzzleDirector","Actor / 서버에서 규칙 실행","Switches 배열, DoorRef"]],"steps":[["RepNotify 지정","BP_RelaySwitch의 bActive를 RepNotify로 바꿉니다. OnRep_bActive에서 ApplySwitchVisual을 호출합니다. 함수는 bActive에 따라 정해진 색을 선택해 적용하며 Toggle Visibility 같은 반전 동작은 쓰지 않습니다. BeginPlay에서도 현재값을 적용합니다."],["호스트 외형 처리","서버에서 상태를 설정하는 경로도 동일 표시 함수를 호출하도록 명확히 합니다. Blueprint의 Set 경로에서 RepNotify가 로컬 실행될 수 있으므로 중복 호출에도 안전하게 설계합니다. 소리 같은 일회성 효과를 상태 적용 함수에 넣지 않습니다."],["문 상태와 판정","BP_RelayDoor는 Replicates=true, bOpen RepNotify입니다. Director의 Switches 배열과 DoorRef를 Instance Editable로 연결합니다. 스위치 변경 후 서버 Director 참조를 스위치의 Instance Editable 변수 DirectorRef로 주입한 뒤, 직접 만든 EvaluatePuzzle 함수를 호출하고 두 Switch가 활성화되면 Door.bOpen=true로 설정합니다. 한 번 열린 문은 닫지 않습니다."],["문 외형과 충돌","Door의 Scene Root 아래 Mesh를 두고 초기 ClosedRelativeLocation을 저장합니다. ApplyDoorVisual은 bOpen이면 ClosedLocation+(0,0,300), 아니면 ClosedLocation을 Set Relative Location으로 설정하고 충돌도 NoCollision/BlockAll로 명시합니다. 첫 구현은 애니메이션 없이 최종 상태를 정확히 맞춥니다."],["초기 동기화","클라이언트는 OnRep와 BeginPlay 모두에서 현재값을 적용합니다. 기본 false는 변화 알림이 생기지 않을 수 있기 때문입니다. 나중에 참가하는 클라이언트가 열린 문을 볼 수 있는지 테스트 계획에 넣고, 별도 프로세스 접속은 s05/s08에서 확인합니다."]],"graph":"Server: bActive SET → EvaluatePuzzle → bOpen SET\n          │ 복제                      │ 복제\nClient: OnRep_bActive              OnRep_bOpen\n        → ApplySwitchVisual        → ApplyDoorVisual\n\n표시 함수: 현재값 → 정해진 최종 외형 (반복 호출해도 동일)","checks":["두 창의 스위치 색과 문 위치·충돌 상태가 일치한다.","표시 함수를 두 번 호출해도 문이 더 멀리 이동하지 않는다.","닫힌 기본 상태도 BeginPlay에서 올바르게 표시한다."],"trap":"Multicast로 문 열기 애니메이션만 보내면 그 순간 접속하지 않은 플레이어는 상태를 놓칠 수 있습니다. 지속 상태와 순간 연출을 분리합니다.","quiz":["ApplyDoorVisual에서 Add Local Offset(300)을 쓰면 왜 위험할까?","초기화나 RepNotify가 반복되면 이동량이 누적됩니다. 저장한 기준 위치에서 최종 위치를 계산해 Set해야 합니다."],"challenge":"bOpen을 기준으로 짧은 문 애니메이션을 추가하되 최초 참가자는 최종 상태로 즉시 배치하세요.","refs":["network"]},{"id":"s04","stage":2,"title":"퍼즐을 데이터와 컴포넌트로 확장","time":"6–8시간","tags":["의존성","식별자","리팩터링"],"goal":"새 방을 추가해도 플레이어 상호작용 그래프를 수정하지 않는다.","concept":"인터페이스는 결합을 줄여도 로딩과 참조 비용을 자동으로 없애지는 않습니다. 저장용 식별자는 액터 표시 이름이 아니라 직접 정한 안정적인 ID를 사용합니다.","assets":[["BPC_InteractableInfo","Actor Component","Prompt(Text), InteractionId(Name)"],["ST_PuzzleConfig","Structure","PuzzleId, RequiredSwitchIds(Name Array)"],["SwitchRegistry","Map\u003cName, BP_RelaySwitch Ref>","서버 Director"],["DT_Puzzles","Data Table","방별 요구 스위치 목록"]],"steps":[["책임 분리","스위치의 외형/상태, Director의 충족 규칙, 플레이어의 요청 전송을 구분합니다. 공통 안내 문구와 InteractionId는 BPC_InteractableInfo로 묶고, 서버 규칙은 Director에 남깁니다. UI용 프롬프트 조회 인터페이스를 추가할 수 있습니다."],["ID 등록","각 스위치 인스턴스에 Sw_A01 같은 고유 SwitchId를 지정합니다. 서버 Director.InitializeRegistry에서 배열을 순회하고 Map.Contains(ID)를 검사합니다. None/중복 ID는 로그에 남기고 퍼즐 시작을 중단합니다. 원본 액터 배열은 레벨에서 주입합니다."],["설정 읽기","DT_Puzzles의 선택한 행에서 RequiredSwitchIds를 읽습니다. 각 ID를 Registry.Find로 조회하고 존재 여부를 확인합니다. 누락된 설정은 “완료”로 간주하지 말고 오류 상태로 둡니다."],["의존 관계 검토","Reference Viewer와 Size Map으로 어떤 자식 BP·메시·효과가 함께 로드되는지 확인합니다. 당장 필요한 작은 에셋은 하드 참조를 유지하고, 큰 선택형 에셋은 Soft Object Reference와 비동기 로드 완료 후 사용을 검토합니다. 캐스트 자체를 일괄 금지하지 않습니다."],["확장 실험","방 B에 스위치 3개와 문을 배치합니다. Director를 별도로 두고 새 데이터 행과 ID 참조를 지정합니다. 플레이어 BP 수정 없이 각 방이 독립적으로 열리는지 테스트합니다."]],"graph":"플레이어 → 상호작용 인터페이스 → 스위치 상태\nDirector: DT_Puzzles.RequiredSwitchIds\n  → Registry.Find(ID) → 모든 상태 검사 → 해당 Door.bOpen\n\n초기화 검사: ID 없음 / 중복 / 참조 누락 → 시작 보류 + 진단","checks":["스위치 3개 방을 플레이어 그래프 변경 없이 추가했다.","중복 ID와 없는 ID를 초기화 때 발견한다.","필요한 참조와 불필요한 로드 의존성을 설명할 수 있다."],"trap":"액터의 표시 이름은 편집·복제 과정에서 바뀔 수 있습니다. 저장이나 설정 연결에는 직접 지정한 ID를 사용하고 유일성을 검사합니다.","quiz":["모든 참조를 Soft Reference로 바꾸면 항상 좋아질까?","아닙니다. 비동기 로딩·실패·사용 시점 관리가 필요해집니다. 실제 메모리/로드 비용과 사용 패턴을 보고 선택합니다."],"challenge":"스위치 요구 조건을 “모두 활성”과 “N개 이상”으로 확장하고 설정 오류 검사도 추가하세요.","refs":["data","communication"]},{"id":"s05","stage":2,"title":"승리 판정과 연결 실패","time":"7–10시간","tags":["경쟁 조건","접속 종료","네트워크 테스트"],"goal":"동시 입력, 플레이어 이탈, 늦은 접속에서도 퍼즐 상태가 일관된다.","concept":"UI는 접속 상태를 반영하고 서버는 유효한 플레이어 집합을 기준으로 판정합니다. 같은 프레임에 두 요청이 와도 서버가 순서대로 처리하며, 최종 규칙은 명시적으로 결정되어야 합니다.","assets":[["BP_ExitZone","Actor / Box Collision","서버 탈출 판정"],["EscapedPlayers","PlayerState Reference Array","중복 없는 목록"],["PuzzlePhase","RepNotify Enum","BP_RelayGS"],["SessionPlayers","PlayerController Reference Array","서버 GM 관리"]],"steps":[["인원과 단계","GM의 Event OnPostLogin에서 NewPlayer를 SessionPlayers.AddUnique합니다. 2명이면 GS.PuzzlePhase=Playing, 1명이면 Waiting입니다. Logout에서는 해당 Controller와 PlayerState를 각 목록에서 제거합니다. 이 과정은 최대 2명을 대상으로 하며 추가 참가 허용 정책도 GM에서 명시합니다."],["탈출 영역","ExitZone Box는 Pawn Overlap. 서버에서만 Begin/End Overlap을 처리합니다. 유효한 플레이어 캐릭터이면 PlayerState를 AddUnique/Remove합니다. EvaluateEscape는 열린 Door, Playing 단계, 현재 참가자 2명 모두 영역 안이라는 조건을 검사해 Complete로 한 번 전환합니다."],["게임 종료 UI","GS의 OnRep_PuzzlePhase와 서버 상태 설정 경로에서 OnPhaseChanged Dispatcher를 알립니다. 로컬 PlayerController는 참조가 유효해진 뒤 구독하고 현재값도 표시합니다. Waiting은 대기 문구, Complete는 승리 문구를 보여 주며 입력 요청도 서버에서 거절합니다."],["이탈·복귀 정책","Playing 중 한 명이 떠나면 Waiting으로 전환하고 열린 문/스위치는 유지합니다. 새로운 참가자가 오면 Playing을 재개하고 현재 상태로 표시합니다. Complete 이후에는 완료 상태를 유지합니다. 재접속은 동일 계정 복원이 아니라 빈 자리에 새 플레이어가 참가하는 범위입니다."],["네트워크 테스트 행렬","PIE의 Network Emulation 설정에서 지연 100ms, 패킷 손실 2%를 각각 시험합니다. 2개 클라이언트 모드와 Listen Server 모드를 나눠 테스트하고 두 사람이 같은 스위치를 거의 동시에 누르게 합니다. 늦은 참가는 s08의 개발 빌드 호스트에 두 번째 프로세스를 나중에 접속해 확인합니다."]],"graph":"OnPostLogin/Logout → 유효 참가자 목록 갱신\n → 인원 \u003c 2: Waiting / 인원 == 2: Playing\nExitZone Begin/End → EscapedPlayers 갱신\n → 문 열림 AND 참가자 2명 모두 탈출 → Complete\n\nComplete는 단방향 전환 / 클라이언트 UI는 현재 Phase를 읽음","checks":["같은 스위치 두 번 토글의 최종 상태가 모든 창에서 같다.","한 명이 떠나면 Waiting이고 새 참가 후 상태가 복원된다.","문이 닫혔거나 한 명만 탈출했을 때 승리하지 않는다."],"trap":"이벤트 발생 순서만으로 접속 종료를 처리하면 파괴된 참조가 남을 수 있습니다. Logout과 유효성 검사를 통해 목록을 정리하고, 게임 종료 알림은 중복되어도 안전해야 합니다.","quiz":["두 사람이 동시에 같은 스위치를 눌렀을 때 반드시 활성화되어야 할까?","현재 규칙은 토글 두 번이므로 원래 상태로 돌아갈 수 있습니다. 공동 활성화가 의도라면 토글 대신 SetActive(true)라는 다른 규칙을 설계해야 합니다."],"challenge":"테스트 표에 실행 모드, 지연, 손실, 재현 절차, 기대값, 실제값, 수정 사항을 남기세요.","refs":["network","rpc"]},{"id":"s06","stage":2,"title":"버전 있는 저장과 복원","time":"6–9시간","tags":["마이그레이션","Checkpoint","복원"],"goal":"호스트가 퍼즐 체크포인트를 저장하고 재호스팅할 때 안정적으로 복원한다.","concept":"직렬화하는 것은 영속 데이터입니다. 월드 Actor 참조를 그대로 저장해 다음 실행에서도 쓸 수 있다고 가정하지 않습니다. 서버 상태를 저장하고 ID를 이용해 새 월드의 객체에 적용합니다.","assets":[["SG_Relay","SaveGame","SchemaVersion=2, MapId, ActiveSwitchIds"],["SavedDoorIds","Name Array","열린 문들의 안정 ID"],["BP_RelayGI","GameInstance","로드된 스냅샷·저장 서비스"],["RestoreCheckpoint","직접 제작 함수","서버 Director"]],"steps":[["저장 범위 고정","BP_RelayGI를 GameInstance로 만들고 Project Settings → Maps & Modes의 Game Instance Class에 지정합니다. 호스트가 가진 로컬 파일에 퍼즐 상태만 저장합니다. 계정·온라인 영구 저장·중간 이동 위치 복원은 포함하지 않습니다. SwitchId, DoorId를 명시하고 슬롯 이름은 RelayCheckpoint로 정합니다."],["스냅샷 생성","서버에서 살아 있는 Registry를 읽어 활성 Switch ID와 열린 Door ID 목록을 만듭니다. 새로운 SG_Relay 객체에 SchemaVersion, MapId와 함께 복사한 뒤 비동기로 저장합니다. 저장 중 이 객체를 다시 수정하지 않습니다."],["복원 시점 통제","서버 GM 시작에서 저장 데이터를 읽고 타입·버전·맵을 검증합니다. 모든 Director의 Registry 초기화 완료 뒤 RestoreCheckpoint를 호출합니다. GM에 bWorldReady를 두고 초기값 false로 설정합니다. 인원 변경과 상호작용 검사에도 이 값을 포함하여 로드 중에는 Playing으로 전환하지 않습니다. 복원 또는 새 게임 초기화가 끝나면 true로 바꾸고 참가 인원에 따라 단계를 재평가합니다."],["버전 변환과 실패","예시 V1은 스위치 ID만 있었다고 정합니다. V1 로드 시 Door ID 목록은 비운 뒤 스위치 조건으로 재계산하는 변환 함수를 거쳐 V2 메모리 구조로 만듭니다. 알 수 없는 미래 버전이나 로드 실패는 원본 덮어쓰기를 보류하고 새 게임 선택을 받습니다. 실제 이전 형식 테스트 파일을 따로 보관합니다."],["상태 적용","ID가 Registry에 있으면 서버의 상태 설정 함수를 호출합니다. 없는 ID는 기록하고 무시하거나 복원을 거부하는 정책을 정합니다. 복원 완료 후 문 조건을 재평가하고 복제 변수로 클라이언트 외형을 갱신합니다. 동일 스냅샷을 두 번 적용해도 같은 결과여야 합니다."]],"graph":"Server 상태 → ID 기반 스냅샷 → Async Save\n새 호스트 실행 → Load → 타입/버전/맵 검증\n → V1이면 변환 → Registry 준비 대기\n → ID 조회 → 서버 상태 SET → 규칙 재평가 → Client에 복제","checks":["호스트 종료 후 재호스팅하면 열린 문과 활성 스위치가 복원된다.","복원 두 번에도 상태가 뒤집히거나 누적되지 않는다.","이전 버전·없는 ID·로드 실패를 각각 시험했다."],"trap":"SaveGame에 Actor Reference를 저장했다고 새 월드의 동일 객체와 자동으로 연결되는 것은 아닙니다. 안정 ID → 현재 월드 참조의 매핑이 필요합니다. 런타임 네트워크 ID를 영구 ID로 사용하지 않습니다.","quiz":["저장 중 원본 상태가 바뀌면 어떻게 일관성을 유지할까?","저장 직전 필요한 값만 별도 스냅샷 객체에 복사하고 저장 완료까지 그 객체를 변경하지 않는 방식으로 경계를 고정합니다."],"challenge":"저장 실패 시 재시도 안내를 만들고 검증된 이전 백업 슬롯을 유지하는 정책을 설계하세요.","refs":["save"]},{"id":"s07","stage":2,"title":"성능 예산과 근거 있는 개선","time":"6–10시간","tags":["Unreal Insights","측정","부하 테스트"],"goal":"같은 테스트 장면에서 병목을 측정하고 개선 전후를 비교한다.","concept":"60fps 목표라면 한 프레임은 약 16.67ms입니다. CPU와 GPU 작업은 겹쳐 실행되므로 각 시간을 단순 합산해 프레임 시간을 계산하지 않습니다. 최적화는 결과의 정확성을 유지해야 합니다.","assets":[["성능 기준 장면","고정 카메라·동일 해상도","재현 가능한 부하"],["측정 기록","평균·느린 구간·메모리·RPC 빈도","전후 비교"],["Unreal Insights","엔진 프로파일링 도구","CPU 타이밍 분석"]],"steps":[["목표 명시","테스트 PC 사양, 해상도 1920×1080, 품질 프리셋, 목표 60fps, 플레이어 2명을 기록합니다. 셰이더 준비와 초기 로딩이 끝난 뒤 같은 구간을 최소 60초씩 3회 측정합니다. 이 수치는 학습용 목표이며 모든 PC 성능 보장은 아닙니다."],["큰 병목 구분","Development 실행에서 stat unit과 stat game을 확인합니다. Frame, Game, Draw, GPU 중 긴 항목과 스파이크 시점을 기록합니다. GPU가 지배적이면 먼저 렌더링 부하를 살펴봅니다."],["추적 기록","설치 엔진의 Unreal Insights 안내에 따라 Timing 트레이스를 수집합니다. 예를 들어 개발 실행 인자에 -trace=cpu,frame,bookmark -statnamedevents를 사용하고 Insights에서 캡처를 엽니다. 버전별 수집 UI와 옵션은 공식 문서로 확인합니다. 과도한 상세 추적 비용도 감안합니다."],["한 가설 검증","스위치마다 Tick으로 UI를 갱신한다는 가정을 실험용 복사본에서 만들고, 변경 알림 기반으로 전환해 호출 수를 비교합니다. 실제 작품에 없는 병목을 개선했다고 주장하지 않습니다. 비용이 작은 부분은 더 복잡하게 만들 이유가 없을 수 있습니다."],["부하와 판단","테스트 맵의 스위치를 20/100/300개로 늘려 경향을 관찰합니다. 동일 장면에서 전후 측정을 반복하고 네트워크 메시지 빈도도 확인합니다. Blueprint CPU 비용이 계속 지배적이면 해당 계산만 C++ 경계 후보로 기록하고, C++ 구현 자체는 선택 심화로 남깁니다."]],"graph":"목표/환경 고정 → Frame/Game/Draw/GPU 측정\n → 병목 가설 → 추적에서 근거 찾기\n → 변경 하나 → 동일 조건 재측정\n → 정확성 회귀 테스트 → 개선 유지 또는 되돌리기","checks":["동일 조건 3회 측정값과 환경을 남겼다.","느린 지점이 CPU·GPU·로딩 중 어디인지 근거로 설명했다.","개선 뒤 멀티플레이 상태·입력·저장 회귀 테스트를 통과했다."],"trap":"에디터의 작은 창과 패키지 전체 화면을 비교하면 해상도·에디터 부하가 섞입니다. 같은 구성·장면·해상도로 비교하고, GPU 제한 상태에서는 Blueprint 개선이 FPS로 드러나지 않을 수도 있습니다.","quiz":["평균 60fps이면 끊김이 없다고 볼 수 있을까?","아닙니다. 간헐적으로 긴 프레임이 생길 수 있습니다. 프레임 시간 분포와 느린 구간의 원인을 함께 확인해야 합니다."],"challenge":"성능 보고서에 “무엇을 바꾸지 않았는가”보다 “어떤 근거로 무엇을 바꿨고 결과가 어땠는가”를 쓰세요.","refs":["profile","basics"]},{"id":"s08","stage":2,"title":"배포와 설계 리뷰","time":"6–10시간","tags":["패키징","회귀 테스트","시니어 평가"],"goal":"2인이 실제로 실행할 수 있는 협동 빌드와 인수인계 문서를 전달한다.","concept":"시니어 수준의 결과물은 기능 목록뿐 아니라 재현 가능한 검증과 의사결정 근거를 포함합니다. 이번 배포 범위는 Windows Development 빌드의 로컬/LAN Listen Server이며 인터넷 세션 서비스는 별도 과제입니다.","assets":[["RelayProtocol Development","Windows 패키지","Listen Server 검증"],["README / TESTS / DESIGN","문서","실행·검증·설계"],["known-issues","알려진 제한","버전과 해결 우선순위"]],"steps":[["개발 빌드 준비","기본 맵과 패키징 맵 목록에 L_Relay를 지정하고 모든 에셋을 저장합니다. 필요한 SDK/런타임은 플랫폼 공식 안내를 확인합니다. 초급에서 만든 단일 플레이 패키지 체크리스트도 반복합니다."],["호스트와 참가","Development 실행 파일을 첫 프로세스로 열어 콘솔에서 open L_Relay?listen을 입력합니다. 두 번째 프로세스의 콘솔에서 open 127.0.0.1로 접속합니다. 호스트는 기본 게임 포트를 사용하는 같은 PC 테스트 기준입니다. 콘솔 키는 Project Settings → Input의 Console Keys에서 확인합니다."],["LAN와 늦은 접속","같은 LAN의 다른 PC에서는 호스트의 LAN IP를 사용합니다. OS 방화벽에서 해당 앱 통신을 허용해야 할 수 있습니다. 호스트가 문을 연 뒤 참가하여 상태를 확인합니다. 이 방법은 NAT 통과·로비·인터넷 매칭을 제공하지 않습니다."],["최종 회귀 검사","호스트/클라이언트 양쪽 입력, 거리 밖 요청, 동시 토글, 늦은 참가, 이탈, 2인 탈출, 재호스팅 복원, 저장 실패, 성능 기준을 확인합니다. 에디터에서만 성공한 항목을 패키지 성공으로 표시하지 않습니다. Shipping 전환 시에는 콘솔 대신 Host/Join UI가 필요하므로 별도 후속 범위로 둡니다."],["설계 리뷰와 제출","빌드 전체 폴더, 엔진 버전, 조작법, 호스트/접속법, 테스트 표, 설계 그림, 성능 전후 기록, 알려진 한계를 묶습니다. 각 설계에 선택 이유·대안·변경 비용을 적고 다른 사람이 문서만으로 실행하도록 합니다."]],"graph":"개발 빌드 → 호스트(open L_Relay?listen)\n          → 참가(open 127.0.0.1 / LAN IP)\n → 권한·상태·접속·복원·성능 검증\n → 재현 문서 + 설계 근거 + 전체 빌드 전달","checks":["별도 프로세스 2개에서 시작부터 공동 탈출까지 성공했다.","문이 열린 뒤 참가한 플레이어에게도 열린 상태가 보인다.","설계·테스트·성능·알려진 한계 문서를 다른 사람에게 전달했다."],"trap":"PIE의 성공은 별도 실행 파일이나 다른 PC의 성공을 보장하지 않습니다. Listen Server와 Dedicated Server 배포도 다릅니다. 이 과정은 소스 빌드가 필요한 전용 서버 배포까지 완료했다고 간주하지 않습니다.","quiz":["이 과정을 완료하면 자동으로 시니어 개발자라고 할 수 있을까?","아닙니다. 이 과정은 시니어가 다루는 설계와 검증 문제의 입문입니다. 실제 팀 협업, 장기 유지보수, 여러 프로젝트의 출시 경험으로 역량을 더 검증해야 합니다."],"challenge":"새 동료가 “스위치 3개 방”을 추가하는 데 걸리는 시간과 질문 수를 측정하고 문서를 개선하세요.","refs":["package","network","profile"]}];
const glossary=[["Actor","월드에 배치하거나 Spawn할 수 있는 객체. 수집물, 문, 캐릭터 등이 해당합니다."],["Component","Actor에 붙여 기능을 나누는 구성 요소. Mesh, Collision, Health 같은 역할을 맡습니다."],["Class / Instance","설계도 / 그 설계도로 만들어진 실제 객체. 같은 클래스라도 인스턴스 값은 다를 수 있습니다."],["Exec / Data Pin","실행 흐름을 연결하는 흰색 핀 / 값과 객체 참조를 전달하는 색 핀."],["Reference","현재 사용할 객체를 가리키는 값. 클래스 에셋과 월드 인스턴스 참조는 다릅니다."],["Cast","이미 존재하는 객체가 특정 타입인지 검사하고 그 타입의 기능에 접근하는 작업. 생성이나 검색이 아닙니다."],["Function / Custom Event","재사용 가능한 즉시 처리 / 이벤트 그래프의 실행 진입점. 일반 함수에는 Delay 같은 지연 노드를 넣지 않습니다."],["Pure Function","Exec 핀 없이 값을 계산하는 함수. 연결된 사용 지점에 따라 여러 번 평가될 수 있어 비싼 연산에 주의합니다."],["Interface / Dispatcher","다양한 객체에 공통 요청을 전달하는 규약 / 변경을 구독자에게 알리는 신호. 둘 다 대상을 연결해야 합니다."],["Overlap / Hit","충돌 영역의 겹침 알림 / 막는 충돌의 접촉 알림. Collision Response와 이벤트 설정을 함께 확인합니다."],["GameMode / GameState","게임 규칙과 서버 판단 / 클라이언트도 읽을 공유 게임 상태. GameMode는 서버에만 있습니다."],["PlayerController / PlayerState","플레이어 제어와 소유자 관련 처리 / 다른 참가자에게도 공유할 플레이어 상태."],["GameInstance / SaveGame","앱 실행 동안 레벨을 넘어 유지되는 객체 / 디스크 저장에 사용할 데이터 객체."],["Authority / Ownership","서버가 상태를 확정하는 권한 / 어떤 클라이언트 연결에 속한 Actor인지의 관계. 같은 뜻이 아닙니다."],["Replication / RepNotify","서버 상태를 클라이언트에 전달 / 복제 변수 변경을 수신했을 때 표시 등을 갱신하는 알림."],["RPC","다른 네트워크 실행 위치에 요청하는 호출. Actor 복제 여부·소유권·호출 방향을 함께 이해해야 합니다."],["멱등성","같은 상태 적용을 여러 번 해도 결과가 같은 성질. 문 위치를 더하지 않고 정해진 위치로 설정하는 예가 있습니다."],["Profiling","어디에 얼마나 시간이 쓰이는지 실제로 측정하는 일. 병목 추측을 검증합니다."]];

const blank=()=>({schema:1,done:{},checks:{},notes:{},journal:'',last:'b01',weekly:6});

let state=blank(),storageOK=true,view={type:'home'},pendingImport=null,toastTimer;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validateState(raw){
 if(!raw||raw.schema!==1||!raw.done||!raw.checks||!raw.notes||typeof raw.done!=='object'||typeof raw.checks!=='object'||typeof raw.notes!=='object')throw Error('지원하지 않는 백업 형식입니다.');
 const next=blank();
 for(const id of ids){if(raw.done[id]===true)next.done[id]=true;if(Array.isArray(raw.checks[id]))next.checks[id]=[0,1,2].map(i=>raw.checks[id][i]===true);if(typeof raw.notes[id]==='string')next.notes[id]=raw.notes[id].slice(0,20000);if(next.done[id]&&(!next.checks[id]||!next.checks[id].every(Boolean)))delete next.done[id];}
 if(typeof raw.journal==='string')next.journal=raw.journal.slice(0,50000);if(ids.has(raw.last))next.last=raw.last;if([3,6,10,15].includes(raw.weekly))next.weekly=raw.weekly;return next;
}
try{const saved=localStorage.getItem(KEY);if(saved)state=validateState(JSON.parse(saved));}catch(e){storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}$('save-state').textContent=storageOK?'이 브라우저에 진도·메모 자동 저장':'저장 불가 · 기록 내보내기로 백업하세요';}
function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',4000);}
function count(stage){return lessons.filter(l=>(stage===undefined||l.stage===stage)&&state.done[l.id]).length;}
function nav(){
 $('lesson-nav').innerHTML=stages.map((s,i)=>`<div><button class="group-head ${view.type==='stage'&&view.id===i?'selected':''}" data-stage="${i}"><span>0${i+1} &nbsp; ${s.label} · ${esc(s.title)}</span><span>${count(i)}/8</span></button>${lessons.filter(l=>l.stage===i).map((l,k)=>`<button class="lesson-link ${state.done[l.id]?'done':''} ${view.type==='lesson'&&view.id===l.id?'current':''}" data-lesson="${l.id}" ${view.type==='lesson'&&view.id===l.id?'aria-current="page"':''}><span class="n">${state.done[l.id]?'✓':String(k+1).padStart(2,'0')}</span><span>${esc(l.title)}</span></button>`).join('')}</div>`).join('');
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view.type));
 $('nav-count').textContent=count()+' / 24';$('side-percent').textContent=Math.round(count()/24*100)+'%';$('side-bar').style.width=count()/24*100+'%';$('side-progress').setAttribute('aria-valuenow',count());$('save-state').textContent=storageOK?'이 브라우저에 진도·메모 자동 저장':'저장 불가 · 기록 내보내기로 백업하세요';
}
function stageCards(){return `<div class="stage-grid">${stages.map((s,i)=>`<article class="stage-card" style="--stage-color:${s.color}"><div class="stage-num"><span>0${i+1} / ${s.label}</span><span>${s.en}</span></div><h3>${esc(s.title)}</h3><p class="subtitle">${esc(s.subtitle)}</p><p class="desc">${esc(s.desc)}</p><div class="meta"><span>8개 실습</span><span>${s.hours}</span></div><div class="tinybar"><span style="width:${count(i)/8*100}%"></span></div><button data-stage="${i}">프로젝트 살펴보기 <span aria-hidden="true">↗</span></button></article>`).join('')}</div>`;}
function footer(){return `<div class="footer-line"><span>BLUEPRINT LAB / 직접 만들고, 설명하고, 검증하기</span><span>한국어 학습 가이드 · 2026.09 · UE5 공통 워크플로</span></div>`;}
const heroArt=`<div class="hero-art"><svg viewBox="0 0 400 330" role="img" aria-label="수집에서 상태 변화와 승리까지 이어지는 게임 제작 지도"><defs><pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#609181" opacity=".32"/></pattern><linearGradient id="crystal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ddf7d8"/><stop offset="1" stop-color="#73c8ab"/></linearGradient></defs><rect width="400" height="330" fill="url(#grid)"/><path d="M57 183L203 100L351 184L203 270Z" stroke="#6d9d87" stroke-width="1" fill="#204a40"/><path d="M57 183V210L203 296L351 210V184M203 270V296" fill="none" stroke="#527f6d"/><path d="M91 181L202 118L315 184L202 248Z" fill="none" stroke="#416e5e" stroke-dasharray="4 5"/><path d="M105 205L149 179L201 209L288 158" stroke="#bdd9a0" fill="none" stroke-width="2" stroke-dasharray="5 5"/><ellipse cx="200" cy="181" rx="41" ry="21" fill="#153c33"/><path d="M200 80L230 126L200 180L170 126Z" fill="url(#crystal)"/><path d="M200 80L200 180M170 126L230 126" stroke="#f3ffdf" stroke-width="1"/><path d="M200 80L230 126L200 135Z" fill="#e3f7c7"/><circle cx="106" cy="205" r="7" fill="#ec986a"/><circle cx="290" cy="158" r="7" fill="#bde7cc"/><path d="M107 77L107 47L171 47M253 235L316 235L316 261" stroke="#8cbaa3" fill="none"/><g transform="translate(25 52)"><rect width="102" height="43" rx="6" fill="#183b35" stroke="#78a68f"/><circle cx="13" cy="22" r="3" fill="#efaa80"/><text x="25" y="26" fill="#dbeada" font-size="11" font-family="Consolas,monospace">ON COLLECT</text></g><g transform="translate(255 77)"><rect width="106" height="43" rx="6" fill="#183b35" stroke="#78a68f"/><circle cx="13" cy="22" r="3" fill="#bde7cc"/><text x="25" y="26" fill="#dbeada" font-size="11" font-family="Consolas,monospace">SET SCORE</text></g><g transform="translate(245 253)"><rect width="99" height="35" rx="6" fill="#bde7cc"/><text x="14" y="22" fill="#163b31" font-size="11" font-family="Consolas,monospace">YOU WIN ↗</text></g><path d="M127 75C182 75 228 60 265 77" stroke="#b6dbaa" fill="none"/></svg><div class="hero-caption">FROM EVENT TO EXPERIENCE</div></div>`;
function home(){return `<section class="hero"><div class="hero-copy"><span class="eyebrow">BUILD FIRST. UNDERSTAND DEEPLY.</span><h1>노드를 연결하고,<br><em>게임을 완성하세요.</em></h1><p>초급의 첫 수집 게임부터 2인 협동 퍼즐까지.<br>직접 만들고 검증하며 배우는 UE5 블루프린트 실습 노트.</p><div class="button-row"><button class="btn mint" data-action="continue">${count()?'학습 이어가기':'첫 번째 게임 시작하기'} <span>→</span></button><button class="btn" style="background:#2c5148;border-color:#5e8071" data-action="roadmap">전체 과정 보기</button></div></div>${heroArt}</section>
<div class="stat-strip"><div class="stat"><strong>03</strong><span>직접 만드는 게임</span></div><div class="stat"><strong>24</strong><span>단계별 실습 수업</span></div><div class="stat"><strong>72</strong><span>완료 검증 항목</span></div><div class="stat"><strong>${Math.round(count()/24*100)}<span style="font-size:16px">%</span></strong><span>현재 학습 진도</span></div></div>

<div class="section-head"><h2>시작 전에, 이것만 준비하세요</h2><p>유료 에셋 없이 기본 도형으로 제작</p></div><div class="start-grid"><section class="panel"><h3>작업 환경과 학습 방식</h3><ol class="setup-list"><li><span class="index">01</span><span>UE5와 Windows PC를 준비합니다. <b>Third Person · Blueprint</b> 템플릿에서 시작하고 한 작품을 만드는 동안 엔진 버전을 고정하세요.</span></li><li><span class="index">02</span><span>한국어로 설명하되 에셋·노드 검색어는 영어로 적었습니다. 설치 버전에 따라 메뉴 위치와 템플릿 이름은 다를 수 있습니다.</span></li><li><span class="index">03</span><span>읽기 20% · 제작 60% · 검증과 회고 20%. 매 수업마다 작은 결과물을 실행하고, 노트를 보지 않고 한 가지를 바꿔 보세요.</span></li><li><span class="index">04</span><span>각 수업의 검증 3개를 직접 통과하면 완료로 표시합니다. 다음 단계는 앞 작품을 실행 파일로 만든 뒤 시작하세요.</span></li></ol></section><section class="panel"><h3>나만의 학습 페이스</h3><p class="muted" style="font-size:12px">전체 약 110–170시간의 실습을 예상합니다. 설치·다운로드·문제 해결과 반복 제작에 따라 더 걸릴 수 있습니다.</p><div class="pace"><label for="weekly" style="font-size:12px">주당 학습</label><select id="weekly">${[3,6,10,15].map(n=>`<option value="${n}" ${state.weekly===n?'selected':''}>${n}시간</option>`).join('')}</select><strong id="pace-result" style="font-size:14px">약 ${Math.ceil(110/state.weekly)}–${Math.ceil(170/state.weekly)}주</strong></div><div style="margin:23px 0" class="flow"><span>만들기</span><i>→</i><span>실패 관찰</span><i>→</i><span>설명하기</span></div><div class="callout" style="font-size:11px;padding:15px">시니어 단계는 직급을 보장하는 과정이 아닙니다. 설계·네트워크·성능·출시 검증을 훈련하는 심화 실습입니다.</div><button class="btn secondary" data-view="resources" style="margin-top:16px">사용법 · 공식 문서</button></section></div><p class="guide-note">본문과 진도 기능은 인터넷 없이 사용할 수 있습니다. 공식 문서 링크를 열 때는 인터넷이 필요합니다. 진도 저장은 브라우저와 파일 위치에 따라 달라질 수 있으므로 정기적으로 기록을 내보내세요.</p>${footer()}`;}
function tile(l){const n=lessons.filter(x=>x.stage===l.stage).indexOf(l)+1;return `<button class="lesson-tile ${state.done[l.id]?'done':''}" data-lesson="${l.id}"><span class="number">${state.done[l.id]?'✓':String(n).padStart(2,'0')}</span><span class="tile-text"><h3>${esc(l.title)}</h3><p>${esc(l.goal)}</p><small>${stages[l.stage].label} · ${l.time} · ${l.tags.map(esc).join(' / ')}</small></span></button>`;}
function stagePage(i){const s=stages[i];return `<header class="stage-banner" style="--stage-color:${s.color}"><span class="eyebrow" style="color:${s.color}">PROJECT 0${i+1} / ${s.en}</span><h1>${s.title}</h1><p>${s.subtitle}</p><div class="lesson-tags"><span class="pill">${s.label}</span><span class="pill">8개 수업</span><span class="pill">${s.hours}</span><span class="pill">완료 ${count(i)} / 8</span></div></header><div class="callout"><strong>완성할 결과물</strong>${s.deliver}<p style="margin-top:8px">${s.desc}</p></div><div class="lesson-grid">${lessons.filter(l=>l.stage===i).map(tile).join('')}</div><section class="panel"><h3>이 단계의 통과 기준</h3><p style="font-size:13px">${s.gate}</p><p class="muted" style="font-size:12px;margin-bottom:0">${i===0?'시작 조건: 에디터 설치와 기본 PC 조작. 프로그래밍 경험 없이 시작할 수 있습니다.':i===1?'시작 조건: 초급 게임 패키징과 변수·함수·참조·이벤트 흐름 설명. 별도의 LastStand 프로젝트에서 진행합니다.':'시작 조건: 중급의 컴포넌트·인터페이스·저장·AI·테스트 경험. 별도의 RelayProtocol 프로젝트에서 진행합니다.'}</p></section>${footer()}`;}
function assetTable(l){return `<div class="table-wrap"><table><thead><tr><th scope="col">에셋 / 변수</th><th scope="col">유형 / 기본값</th><th scope="col">위치 / 역할</th></tr></thead><tbody>${l.assets.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function lessonPage(id){const l=lessons.find(x=>x.id===id),s=stages[l.stage],index=lessons.indexOf(l),n=index%8+1,checks=state.checks[id]||[false,false,false];return `<header class="lesson-header"><span class="eyebrow">${s.en} / ${s.title} / LESSON ${String(n).padStart(2,'0')}</span><h1>${esc(l.title)}</h1><p class="goal">${esc(l.goal)}</p><div class="lesson-tags"><span class="tag">${s.label} ${n} / 8</span><span class="tag">예상 ${l.time}</span>${l.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${state.done[id]?'<span class="tag" style="background:#e1efdb">✓ 학습 완료</span>':''}</div></header><div class="lesson-layout"><div class="lesson-body"><section class="body-card"><div class="mini-heading">01 / UNDERSTAND</div><h2>먼저 이해할 개념</h2><p>${esc(l.concept)}</p><h3 style="font-size:14px;margin:23px 0 12px">준비할 에셋과 변수</h3>${assetTable(l)}<p class="small-note" style="font-size:10px;margin:13px 0 0">표의 이름은 이 과정의 제작 규칙입니다. “직접 제작” 함수·이벤트·인터페이스는 해당 수업에서 먼저 정의합니다.</p></section><section class="body-card"><div class="mini-heading">02 / BUILD</div><h2>직접 만들어 보기</h2>${l.steps.map((step,i)=>`<div class="step"><span class="step-num">${i+1}</span><div><h3>${esc(step[0])}</h3><p>${esc(step[1])}</p></div></div>`).join('')}</section><section class="graph-card"><h2>노드 흐름 한눈에 보기</h2><p class="hint">핵심 실행 순서를 요약한 도식입니다. 엔진에 붙여넣는 Blueprint 데이터가 아닙니다.</p><pre>${esc(l.graph)}</pre></section><section class="callout orange"><strong>막혔을 때 확인할 것</strong><p>${esc(l.trap)}</p></section><section class="body-card quiz"><div class="mini-heading">03 / EXPLAIN</div><h2>설명할 수 있으면 이해한 것</h2><details><summary>${esc(l.quiz[0])} <span style="font-size:10px;color:var(--muted)"> · 눌러 해설 보기</span></summary><p>${esc(l.quiz[1])}</p></details></section><section class="body-card"><div class="mini-heading">04 / EXTEND</div><h2>스스로 바꿔 보기</h2><p style="margin-bottom:0">${esc(l.challenge)}</p></section></div><aside class="lesson-aside" aria-label="수업 기록"><section class="panel"><h3>완료 전, 직접 검증</h3><p class="small-note">UE 에디터 또는 지정된 실행 환경에서 확인한 항목만 체크하세요.</p>${l.checks.map((c,i)=>`<label class="criterion"><input type="checkbox" data-check="${i}" ${checks[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}<button class="btn complete-btn" id="complete-lesson" ${!state.done[id]&&!checks.every(Boolean)?'disabled':''}>${state.done[id]?'✓ 완료됨 · 미완료로 되돌리기':'이 수업 완료하기'}</button><p class="small-note" id="complete-help">${state.done[id]?'완료 기록이 저장되었습니다.':'검증 3개를 모두 체크하면 완료할 수 있습니다.'}</p></section><section class="panel"><h3><label for="lesson-notes">나의 제작 메모</label></h3><textarea id="lesson-notes" maxlength="20000" placeholder="엔진 버전 / 막힌 지점 / 해결 원인 / 변경 실험을 기록하세요.">${esc(state.notes[id]||'')}</textarea><p class="small-note">입력할 때 자동 저장 · 최대 20,000자</p></section><section class="panel"><h3>함께 볼 공식 문서</h3><ul class="ref-list">${l.refs.map(k=>`<li><a href="${refs[k][1]}" target="_blank" rel="noopener noreferrer">${refs[k][0]} ↗</a></li>`).join('')}</ul><p class="small-note">Epic Games 공식 문서. 설치한 엔진 버전으로 전환해 확인하세요.</p></section></aside></div><div class="lesson-footer">${index>0?`<button class="btn secondary" data-lesson="${lessons[index-1].id}">← ${esc(lessons[index-1].title)}</button>`:'<span></span>'}${index<lessons.length-1?`<button class="btn" data-lesson="${lessons[index+1].id}">${esc(lessons[index+1].title)} →</button>`:'<button class="btn" data-view="progress">내 학습 기록 보기 →</button>'}</div>${footer()}`;}
function toolsPanel(){return `<div class="button-row"><button class="btn" data-action="export">기록 내보내기 ↓</button><button class="btn secondary" data-action="import">백업 불러오기 ↑</button><button class="btn secondary" data-action="print">전체 교재 인쇄 / PDF</button><button class="btn ghost" data-action="reset">학습 기록 초기화</button></div><p class="guide-note">내보내는 JSON은 진도와 메모의 백업입니다. 교재 HTML과 함께 보관하세요. 다른 브라우저로 옮길 때 백업을 불러오면 됩니다.</p>`;}
function progressPage(){return `<header class="lesson-header"><span class="eyebrow">YOUR LEARNING LOG</span><h1>작게 만들고, 꾸준히 완성하기.</h1><p class="goal">${count()}개 수업 완료 · ${24-count()}개 수업 남음. 체크 개수보다, 다시 만들어 설명할 수 있는지가 중요합니다.</p></header><div class="progress-panel">${stages.map((s,i)=>`<section class="panel"><span class="eyebrow">${s.label}</span><h3>${s.title}</h3><p class="ratio">${count(i)} <span style="font-size:14px;color:var(--muted)">/ 8</span></p><div class="bar"><span style="width:${count(i)/8*100}%"></span></div><button class="btn secondary" style="margin-top:19px" data-stage="${i}">프로젝트 열기</button></section>`).join('')}</div><section class="panel"><h3><label for="journal">제작 회고와 다음 목표</label></h3><textarea class="notepad" id="journal" maxlength="50000" placeholder="이번 주 완성한 기능은? 가장 오래 막힌 원인은? 다음에는 무엇을 혼자 구현할 것인가?">${esc(state.journal)}</textarea><p class="small-note">자동 저장 · 엔진 버전, 빌드 경로와 테스트 결과도 함께 적어 두세요.</p></section><div class="section-head"><h2>학습 기록 보관</h2></div>${toolsPanel()}${footer()}`;}
function glossaryPage(){return `<header class="lesson-header"><span class="eyebrow">REFERENCE DESK / GLOSSARY</span><h1>핵심 용어 사전</h1><p class="goal">이름을 외우기보다, 게임 안에서 누가 무엇을 맡는지 연결해 보세요.</p></header><dl class="glossary-grid">${glossary.map(([k,v])=>`<div class="panel"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="callout"><strong>핀에서 출발해 검색하기</strong>빈 공간 검색에서 원하는 노드가 안 보이면 먼저 대상 객체나 컴포넌트의 참조 핀을 끌어 검색하세요. Context Sensitive 검색은 핀 타입과 현재 클래스에 맞는 후보를 보여 줍니다.</div>${footer()}`;}
function resourcesPage(){return `<header class="lesson-header"><span class="eyebrow">REFERENCE DESK / TOOLS</span><h1>교재 사용법과 공식 자료</h1><p class="goal">노드 흐름을 직접 구현하고, 버전별 차이는 공식 문서에서 확인합니다.</p></header><section class="panel"><h3>이 HTML의 사용 범위</h3><ol style="padding-left:21px;font-size:13px;line-height:2"><li>브라우저에서 파일을 열면 모든 수업을 오프라인으로 읽을 수 있습니다. 설치나 로그인, 외부 폰트가 필요하지 않습니다.</li><li>체크리스트와 메모는 이 브라우저에 저장합니다. 비공개 모드·브라우저 정리·파일 이동에 따라 기록이 없어질 수 있어 JSON 백업을 권장합니다.</li><li>검색은 제목·태그·본문·노드 설명에서 찾습니다. 단계별 과정이나 수업을 선택하면 검색이 해제됩니다.</li><li>전체 인쇄는 24개 수업과 메모를 포함합니다. 브라우저 인쇄 화면에서 “PDF로 저장”을 선택하면 PDF로 보관할 수 있습니다.</li><li>이 파일은 제작용 학습 가이드입니다. 완성된 UE 프로젝트나 실행 가능한 Blueprint 에셋은 포함하지 않습니다. 노드 흐름은 요약 도식이며 직접 만들어야 합니다.</li><li>예제는 UE5의 일반적인 Blueprint 흐름을 기준으로 작성했습니다. 특정 UE 버전에서 전체 프로젝트를 실행 검증한 튜토리얼은 아닙니다. 설치 버전과 템플릿의 차이를 확인하고 각 실습의 테스트로 검증하세요.</li></ol>${toolsPanel()}</section><div class="section-head"><h2>공식 문서 찾아보기</h2><p>2026-09-20 확인 · Epic Games</p></div><section class="panel">${Object.values(refs).map(([name,url],i)=>`<a class="resource-link" target="_blank" rel="noopener noreferrer" href="${url}"><span><span class="mono muted" style="margin-right:18px">${String(i+1).padStart(2,'0')}</span>${name}</span><span>↗</span></a>`).join('')}<p class="guide-note">공식 문서는 핵심 개념의 참고 자료입니다. 게임명, 과제 구성, 수치와 검증 기준은 이 교재의 학습용 설계입니다. Epic Games의 공식 교육 과정이나 인증 과정은 아닙니다.</p></section><div class="section-head"><h2>문제 해결 순서</h2></div><section class="panel"><ol class="setup-list"><li><span class="index">01</span><span><b>재현</b> — 어떤 맵·입력·상태에서 문제를 볼 수 있는지 짧게 적습니다.</span></li><li><span class="index">02</span><span><b>실행 확인</b> — 이벤트와 Branch의 양쪽에 잠시 출력하거나 Breakpoint를 놓습니다.</span></li><li><span class="index">03</span><span><b>데이터 확인</b> — 대상 인스턴스, Is Valid, 변수의 타입·값·기본값을 확인합니다.</span></li><li><span class="index">04</span><span><b>최소 수정</b> — 한 번에 원인 하나를 바꾸고 같은 절차로 검증합니다.</span></li><li><span class="index">05</span><span><b>회귀 확인</b> — 정상 입력뿐 아니라 중복 입력·실패·재시작도 다시 실행합니다.</span></li></ol></section>${footer()}`;}
function searchPage(q){const value=q.trim().toLocaleLowerCase();const matches=lessons.filter(l=>JSON.stringify(l).toLocaleLowerCase().includes(value));return `<header class="lesson-header"><span class="eyebrow">SEARCH THE LAB</span><h1>“${esc(q)}” 검색 결과</h1><p class="goal">${matches.length}개 수업에서 찾았습니다.</p></header>${matches.length?`<div class="lesson-grid">${matches.map(tile).join('')}</div>`:'<div class="empty">일치하는 수업이 없습니다.<br>예: 저장, Timer, RepNotify, 충돌</div>'}${footer()}`;}
function render(){nav();const main=$('main');let title='대시보드';if(view.type==='home')main.innerHTML=home();else if(view.type==='stage'){main.innerHTML=stagePage(view.id);title=stages[view.id].label+' 프로젝트';}else if(view.type==='lesson'){main.innerHTML=lessonPage(view.id);title=stages[lessons.find(l=>l.id===view.id).stage].title;}else if(view.type==='progress'){main.innerHTML=progressPage();title='학습 기록';}else if(view.type==='glossary'){main.innerHTML=glossaryPage();title='용어 사전';}else if(view.type==='resources'){main.innerHTML=resourcesPage();title='공식 자료';}else if(view.type==='search'){main.innerHTML=searchPage(view.query);title='수업 검색';}$('breadcrumb').textContent=title;document.title=(view.type==='lesson'?lessons.find(l=>l.id===view.id).title:title)+' | UE5 Blueprint Lab';}
function closeMenu(){ $('sidebar').classList.remove('open');$('backdrop').classList.remove('open');$('menu-toggle').setAttribute('aria-expanded','false');}
function go(type,id,{push=true,focus=true}={}){view={type,id};if(type==='lesson'){state.last=id;persist();}if(type!=='search')$('search').value='';closeMenu();render();if(push){try{history.replaceState(null,'','#'+(type==='lesson'?id:type==='stage'?'stage-'+id:type));}catch(e){}}window.scrollTo(0,0);if(focus)$('main').focus({preventScroll:true});}
function continueStudy(){let l=lessons.find(l=>l.id===state.last&&!state.done[l.id])||lessons.find(l=>!state.done[l.id])||lessons[lessons.length-1];go('lesson',l.id);}
function exportState(){const payload={app:'UE5 Blueprint Lab',exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='blueprint-lab-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록 백업을 내보냈습니다.');}
function preparePrint(){ $('print-area').innerHTML=`<h1>UE5 Blueprint Lab</h1><p>게임을 만들며 배우는 초급 · 중급 · 시니어 24개 실습</p><p>총 약 110–170시간 · 2026.09 제작 · 완료 ${count()}/24</p><p>설치한 UE5 버전을 고정하고 Third Person / Blueprint 프로젝트로 시작합니다. 본 교재는 독립적인 제작 실습 가이드이며 완성된 Unreal 프로젝트는 포함하지 않습니다. 도식은 핵심 실행 흐름입니다.</p><h2>학습 과정</h2>${stages.map((s,i)=>`<h3>${i+1}. ${s.label} — ${s.title}</h3><p>${s.subtitle} · ${s.hours}<br>${s.gate}</p>`).join('')}<h3>나의 회고</h3><p class="print-note">${esc(state.journal||'기록 없음')}</p>${lessons.map((l,index)=>`<article class="print-lesson"><p>${stages[l.stage].label} / ${stages[l.stage].title} / ${l.time}</p><h2>${String(index+1).padStart(2,'0')}. ${esc(l.title)}</h2><p><b>목표:</b> ${esc(l.goal)}</p><h3>핵심 개념</h3><p>${esc(l.concept)}</p><h3>에셋과 변수</h3>${assetTable(l)}<h3>제작 순서</h3>${l.steps.map((s,i)=>`<div class="print-step"><h3>${i+1}. ${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}<h3>노드 흐름 (직접 구현하는 요약 도식)</h3><pre>${esc(l.graph)}</pre><h3>완료 검증</h3><ul>${l.checks.map((c,i)=>`<li>${(state.checks[l.id]||[])[i]?'[완료]':'[  ]'} ${esc(c)}</li>`).join('')}</ul><p><b>오류 점검:</b> ${esc(l.trap)}</p><p><b>생각할 질문:</b> ${esc(l.quiz[0])}<br><b>해설:</b> ${esc(l.quiz[1])}</p><p><b>확장:</b> ${esc(l.challenge)}</p><h3>나의 메모</h3><p class="print-note">${esc(state.notes[l.id]||'기록 없음')}</p>${l.refs.map(k=>`<p class="print-ref">${refs[k][0]}: ${refs[k][1]}</p>`).join('')}</article>`).join('')}<section class="print-lesson"><h2>핵심 용어 사전</h2>${glossary.map(([k,v])=>`<h3>${esc(k)}</h3><p>${esc(v)}</p>`).join('')}</section>`;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.lesson){go('lesson',b.dataset.lesson);return;}if(b.dataset.stage!==undefined){go('stage',Number(b.dataset.stage));return;}if(b.dataset.view){go(b.dataset.view);return;}
 const action=b.dataset.action;if(action==='continue')continueStudy();else if(action==='roadmap')$('roadmap').scrollIntoView({behavior:'smooth',block:'start'});else if(action==='export')exportState();else if(action==='import')$('import-file').click();else if(action==='print'){preparePrint();window.print();}else if(action==='reset')$('reset-dialog').showModal();
 if(b.id==='complete-lesson'){const id=view.id;if(state.done[id])delete state.done[id];else if((state.checks[id]||[]).length===3&&state.checks[id].every(Boolean))state.done[id]=true;persist();const y=window.scrollY;render();window.scrollTo(0,y);$('complete-lesson').focus({preventScroll:true});toast(state.done[id]?'수업을 완료했습니다. 다음 수업에서 이어가세요.':'수업을 미완료로 되돌렸습니다.');}
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-check]')&&view.type==='lesson'){const id=view.id;if(!state.checks[id])state.checks[id]=[false,false,false];state.checks[id][Number(e.target.dataset.check)]=e.target.checked;if(!state.checks[id].every(Boolean))delete state.done[id];persist();nav();$('complete-lesson').disabled=!state.done[id]&&!state.checks[id].every(Boolean);$('complete-lesson').textContent=state.done[id]?'✓ 완료됨 · 미완료로 되돌리기':'이 수업 완료하기';$('complete-help').textContent=state.checks[id].every(Boolean)?'검증 완료. 수업 완료 버튼으로 진도를 기록하세요.':'검증 3개를 모두 체크하면 완료할 수 있습니다.';const badge=document.querySelector('.lesson-tags .tag[style]');if(badge&&!state.done[id])badge.remove();}
 if(e.target.id==='weekly'){state.weekly=Number(e.target.value);persist();$('pace-result').textContent=`약 ${Math.ceil(110/state.weekly)}–${Math.ceil(170/state.weekly)}주`;}
});
document.addEventListener('input',e=>{if(e.target.id==='lesson-notes'){state.notes[view.id]=e.target.value;persist();}if(e.target.id==='journal'){state.journal=e.target.value;persist();}});
$('search').addEventListener('input',e=>{const q=e.target.value;if(!q.trim()){view={type:'home'};render();return;}view={type:'search',query:q};render();window.scrollTo(0,0);});
$('menu-toggle').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('backdrop').classList.toggle('open',open);$('menu-toggle').setAttribute('aria-expanded',String(open));};$('backdrop').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('cancel-reset').onclick=()=>$('reset-dialog').close();$('confirm-reset').onclick=()=>{state=blank();persist();$('reset-dialog').close();go('home');toast('학습 기록을 초기화했습니다.');};
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>3000000)throw Error('3MB 이하의 기록 백업을 선택하세요.');const raw=JSON.parse(await file.text());pendingImport=validateState(raw.state||raw);$('import-summary').textContent=`${Object.keys(pendingImport.done).length}개 완료 기록과 ${Object.keys(pendingImport.notes).length}개 수업 메모를 읽었습니다.`;$('import-dialog').showModal();}catch(err){pendingImport=null;toast('백업을 읽지 못했습니다. '+err.message);}});
$('cancel-import').onclick=()=>{pendingImport=null;$('import-dialog').close();};$('confirm-import').onclick=()=>{if(!pendingImport)return;state=pendingImport;pendingImport=null;persist();$('import-dialog').close();go('progress');toast('학습 기록을 복원했습니다.');};
window.addEventListener('beforeprint',preparePrint);
function route(){const hash=decodeURIComponent(location.hash.slice(1));if(ids.has(hash))go('lesson',hash,{push:false,focus:false});else if(/^stage-[0-2]$/.test(hash))go('stage',Number(hash.slice(-1)),{push:false,focus:false});else if(['home','progress','glossary','resources'].includes(hash))go(hash,undefined,{push:false,focus:false});else go('home',undefined,{push:false,focus:false});}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
